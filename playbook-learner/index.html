ty.general.lvol","what":"The hand on lvcreate: creates or grows a logical volume inside an existing volume group. From community.general.","params":"vg (the pool — must already exist), lv (the volume name), size (e.g. 1500m), state: present","breaks":"No logical volume exists for the filesystem task to format.","links":"Depends on the fail guard having verified the VG, and on the Q4 collection install. Feeds filesystem: vg + lv become its /dev/<vg>/<lv> path."},"filesystem":{"name":"community.general.filesystem","what":"The hand on mkfs: writes a filesystem onto a device. From community.general.","params":"fstype (ext4, xfs, ...), dev (the device path — read it from lvdisplay's LV Path, never guess)","breaks":"The volume exists but is unusable raw space — nothing can mount or store data on it.","links":"Depends on lvol having created the device at exactly the path given to dev."},"fail":{"name":"ansible.builtin.fail","what":"Aborts the play for the current host with a message you choose — Ansible's controlled stop. A failed host is removed from the rest of the play.","params":"msg (the exact message), usually paired with a when guard","breaks":"Without it, a host missing its prerequisite (like the yellowtail VG) would stumble into later tasks and fail messily — or worse, half-succeed.","links":"The guard pattern: fail plus when turns a missing prerequisite into a designed outcome and protects every task after it."},"debug":{"name":"ansible.builtin.debug","what":"Prints a message (or a variable's value) during a run.","params":"msg, or var","breaks":"In lvm.yml the rescue would recover silently — and the required announcement message would never print.","links":"Pairs with block/rescue: it is how a handled failure announces itself."},"get_url":{"name":"ansible.builtin.get_url","what":"Downloads a file from a URL onto the managed host.","params":"url, dest, force: true (always fetch a fresh copy)","breaks":"The hwreport skeleton never arrives, and the five lineinfile tasks have no file to edit.","links":"Feeds lineinfile in Q13. Not to be confused with uri, which calls APIs and returns data instead of saving files."},"lineinfile":{"name":"ansible.builtin.lineinfile","what":"Ensures a line is in a file: finds the line matching regexp and replaces it with line (or inserts it).","params":"path, regexp (the finder), line (the replacement)","breaks":"The report keeps its blank labels — the file exists but says nothing about the host.","links":"Depends on get_url having delivered the file; the line values come from facts."},"include_role":{"name":"ansible.builtin.include_role","what":"Applies a role from inside a task — the dynamic way to run a role, loaded when the task executes.","params":"name (the role, matching its directory under roles/)","breaks":"role.yml would have a task that does nothing — the apache role never runs.","links":"The dynamic counterpart of the static roles: list used in timesync.yml and roles.yml."},"rpm_key":{"name":"ansible.builtin.rpm_key","what":"Imports a GPG public key into the RPM keyring so signed packages can be verified.","params":"key (path or URL), state: present","breaks":"Repos with gpgcheck=true refuse every package — dnf cannot verify signatures against a key it does not hold.","links":"Must run BEFORE yum_repository definitions that reference the key; order is the dependency."},"yum_repository":{"name":"ansible.builtin.yum_repository","what":"Writes a yum/dnf repository definition into /etc/yum.repos.d/.","params":"name, description, baseurl, gpgcheck, gpgkey, enabled","breaks":"The hosts have no BaseOS/AppStream sources — dnf finds nothing to install from.","links":"Depends on rpm_key having imported the key its gpgkey points at."},"facts":{"name":"Facts & hostvars (concept)","what":"Facts are per-host data Ansible gathers automatically (ansible_facts: fqdn, default_ipv4, devices, memory...). hostvars lets one host's template or task read ANOTHER host's facts.","params":"ansible_facts['fqdn'], ansible_facts['default_ipv4']['address'], hostvars[x]['ansible_facts']...","breaks":"Templates could only print fixed text — no page naming its own host, no hosts file built from the whole fleet's addresses.","links":"Consumed by template (Q7, Q10), lineinfile (Q13), and guarded by when tests against ansible_facts['lvm']['vgs'] (Q9)."},"vault":{"name":"Ansible Vault (concept)","what":"Encrypts whole files (or single variables) with a password so secrets can live beside playbooks. rekey rotates a vault file's password in one operation.","params":"ansible-vault create / view / rekey; --vault-password-file points at the password file at runtime","breaks":"Secrets would sit in plaintext — or, with a decrypt/re-encrypt habit instead of rekey, Q16's requirement fails outright.","links":"locker.yml (Q14) feeds users.yml (Q15) through vars_files; the run command must carry --vault-password-file or nothing decrypts."}};

function stripQuotes(s){ if(s.length>=2){ const a=s.charAt(0), b=s.charAt(s.length-1); if((a==='"'&&b==='"')||(a==="'"&&b==="'")) return s.slice(1,-1); } return s; }
function normBase(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }
function normScalar(blank, s){ let v = normBase(s); if(!blank.q) v = stripQuotes(v); return v; }
function blankVariants(blank){
  const out = [];
  const push = v => { if(v!=null && out.indexOf(v)<0) out.push(v); };
  push(normScalar(blank, blank.b));
  (blank.a||[]).forEach(x => push(normScalar(blank, x)));
  if(!blank.q && /^[a-z][\w]*(\.[\w]+)+$/.test(blank.b)) push(blank.b.split('.').pop());
  const low = String(blank.b).toLowerCase();
  if(low==='true'){ push('yes'); push('True'); }
  if(low==='false'){ push('no'); push('False'); }
  return out;
}
function normLines(t){ return String(t==null?'':t).split('\n').map(x => x.replace(/\s+/g,' ').trim()).filter(x => x.length).join('\n'); }
function gradeBlank(blank, input){
  if(blank.m){
    if(normLines(input) === normLines(blank.b)) return true;
    return (blank.a||[]).some(x => normLines(x) === normLines(input));
  }
  return blankVariants(blank).indexOf(normScalar(blank, input)) >= 0;
}
function gradeBash(file, input){
  const b = file.bash; if(!b) return true;
  if(normBase(input) === normBase(b.answer)) return true;
  return (b.a||[]).some(x => normBase(x) === normBase(input));
}
function fileText(file){ return file.segs.map(function(s){ return typeof s === 'string' ? s : s.b; }).join(''); }
function playLineList(file){
  const lines = fileText(file).split('\n');
  while(lines.length && lines[lines.length-1] === '') lines.pop();
  return lines;
}
function parsePlayLine(line, lang){
  if(!line || !line.trim()) return {kind:'empty'};
  if(line.trim() === '---') return {kind:'doc'};
  if(lang === 'yaml'){
    const m = line.match(/^(\s*)(-\s+)?([^:]+?):(\s+|$)(.*)$/);
    if(m){
      const key = m[3].replace(/\s+$/, '');
      if(/^[A-Za-z0-9._\-][A-Za-z0-9._\- ]*$/.test(key)){
        return {kind:'map', indent:m[1], dash:m[2] || '', key:key, sep:m[4], value:m[5]};
      }
    }
  }
  const pm = line.match(/^(\s*(?:-\s+)?)([\s\S]*)$/);
  return {kind:'content', prefix:pm[1], content:pm[2]};
}
function playBlanksFor(file, level){
  if(level === 3) return [];
  const out = [];
  playLineList(file).forEach(function(line, li){
    const p = parsePlayLine(line, file.lang);
    if(level === 1){
      if(p.kind === 'map') out.push({b:p.key, line:li+1, kind:'key', key:p.key, value:p.value});
    } else if(level === 2){
      if(p.kind === 'map'){ if(p.value && p.value.length) out.push({b:p.value, line:li+1, kind:'value', key:p.key}); }
      else if(p.kind === 'content'){ out.push({b:p.content, line:li+1, kind:'content'}); }
    }
  });
  return out;
}
function normWholeLines(t){
  return String(t == null ? '' : t).split('\n').map(function(l){
    const m = l.match(/^(\s*)([\s\S]*)$/);
    return m[1] + m[2].replace(/\s+/g, ' ').replace(/\s+$/, '');
  }).filter(function(l){ return l.trim().length; });
}
function gradeWholeText(expected, input){
  const a = normWholeLines(expected), b = normWholeLines(input);
  if(a.length !== b.length) return false;
  for(let i = 0; i < a.length; i++) if(a[i] !== b[i]) return false;
  return true;
}
function diffWholeText(expected, input){
  const a = normWholeLines(expected), b = normWholeLines(input);
  const lines = []; let count = 0;
  const n = Math.max(a.length, b.length);
  for(let i = 0; i < n; i++){ if(a[i] !== b[i]){ count++; lines.push(i + 1); } }
  return {count:count, lines:lines};
}

function fprog(f){ if(!P[f.id]) P[f.id] = {levels:{}, mastered:false}; return P[f.id]; }
function levelsDoneCount(){ var n=0; FILES.forEach(function(f){ var lp=fprog(f).levels; Object.keys(lp).forEach(function(k){ if(lp[k].done) n++; }); }); return n; }
function levelsTotal(){ var n=0; FILES.forEach(function(f){ n += fileTop(f); }); return n; }
function masteredCount(){ var n=0; FILES.forEach(function(f){ if(fprog(f).mastered) n++; }); return n; }

// ---------- code rendering ----------
function buildLines(file, level, mode){
  var lines = [[]], blankIdx = -1, skipNL = false;
  function pushLine(){ lines.push([]); }
  file.segs.forEach(function(seg){
    if(typeof seg === 'string'){
      var s = seg;
      if(skipNL){ if(s.charAt(0) === '\n') s = s.slice(1); skipNL = false; }
      s.split('\n').forEach(function(piece, j){
        if(j > 0) pushLine();
        if(piece) lines[lines.length-1].push({k:'t', s:piece});
      });
      return;
    }
    blankIdx++;
    var idx = blankIdx;
    if(mode === 'study'){
      seg.b.split('\n').forEach(function(piece, j){
        if(j > 0) pushLine();
        if(piece) lines[lines.length-1].push({k:'tok', i:idx, s:piece});
      });
      return;
    }
    if(seg.l <= level){
      if(seg.m){
        lines[lines.length-1].push({k:'blk', i:idx});
        pushLine(); skipNL = true;
      } else {
        lines[lines.length-1].push({k:'in', i:idx});
      }
      return;
    }
    seg.b.split('\n').forEach(function(piece, j){
      if(j > 0) pushLine();
      if(piece) lines[lines.length-1].push({k:'t', s:piece});
    });
  });
  if(lines.length > 1 && lines[lines.length-1].length === 0) lines.pop();
  var blankLine = {}, blankCol = {};
  lines.forEach(function(nodes, li){
    var col = 0;
    nodes.forEach(function(n){
      if(n.i != null && blankLine[n.i] == null){ blankLine[n.i] = li + 1; blankCol[n.i] = col + 1; }
      if(n.s) col += n.s.length;
    });
  });
  return {lines:lines, blankLine:blankLine, blankCol:blankCol};
}

function blankStateClass(i){
  if(!cur) return '';
  if(cur.reveals.has(i)) return ' revealed';
  if(cur.results[i] === true) return ' ok';
  if(cur.results[i] === false) return ' bad';
  return '';
}
var curCols = {};
function renderCode(file, level, mode){
  if(mode === 'play') return renderPlayCode(file, level);
  var built = buildLines(file, level, mode);
  curLines = built.blankLine; curCols = built.blankCol;
  var blanks = fileBlanks(file);
  var langLabel = file.lang === 'bash' ? 'bash' : file.lang === 'jinja' ? 'jinja · yaml facts' : 'yaml';
  var html = '<div class="vimwrap"><div class="vimbar"><span class="vfile">📄 ' + esc(file.path) + '</span></div><div class="codebox">';
  built.lines.forEach(function(nodes, li){
    html += '<div class="ln" data-line="' + (li+1) + '"><span class="no">' + (li+1) + '</span><span class="lc">';
    nodes.forEach(function(n){
      if(n.k === 't'){ html += hlFragment(file.lang, n.s); }
      else if(n.k === 'tok'){ html += '<span class="tok" data-tok="' + n.i + '">' + hlFragment(file.lang, n.s) + '</span>'; }
      else if(n.k === 'in'){
        var b = blanks[n.i];
        var size = Math.max(4, Math.min(48, b.b.length + 2));
        var val = (cur && cur.values[n.i] != null) ? cur.values[n.i] : '';
        var dis = cur && cur.reveals.has(n.i) ? ' disabled' : '';
        html += '<input class="blank' + blankStateClass(n.i) + '" data-i="' + n.i + '" size="' + size + '" value="' + esc(val) + '" autocomplete="off" autocapitalize="off" spellcheck="false"' + dis + '>';
        html += '<span class="bbtns"><button data-act="hint" data-i="' + n.i + '" title="Hint">💡</button><button data-act="reveal" data-i="' + n.i + '" title="Reveal">👁</button></span>';
      }
      else if(n.k === 'blk'){
        var bb = blanks[n.i];
        var rows = Math.max(2, bb.b.split('\n').length + 1);
        var v2 = (cur && cur.values[n.i] != null) ? cur.values[n.i] : '';
        var dis2 = cur && cur.reveals.has(n.i) ? ' disabled' : '';
        html += '<textarea class="blank multi' + blankStateClass(n.i) + '" data-i="' + n.i + '" rows="' + rows + '" autocomplete="off" autocapitalize="off" spellcheck="false"' + dis2 + '>' + esc(v2) + '</textarea>';
        html += '<span class="blkbtns"><button data-act="hint" data-i="' + n.i + '" class="small">💡 Hint</button><button data-act="reveal" data-i="' + n.i + '" class="small">👁 Reveal</button></span>';
      }
    });
    html += '</span></div>';
  });
  html += '</div></div>';
  return html;
}

var curPlayBlanks = [];
function enrichPlayBlanks(file, level){
  return playBlanksFor(file, level).map(function(pb){
    var raw = playLineList(file)[pb.line - 1] || '';
    var b = {b: pb.b, line: pb.line, kind: pb.kind, key: pb.key || '', e: explainLine(raw, file), h: ''};
    if(pb.kind === 'key'){
      if(/^(ansible|community|redhat)\./.test(pb.key)) b.h = 'This blank is a module name — the engine of the task. ' + moduleGloss(pb.key);
      else if(KEY_GLOSS[pb.key]) b.h = 'This blank is a key name. What it controls: ' + KEY_GLOSS[pb.key];
      else b.h = 'This blank is a key name — the label for the value shown after the colon on this line' + (pb.value ? ' (' + pb.value + ')' : '') + '.';
    } else if(pb.kind === 'value'){
      b.h = 'What belongs after \u2018' + pb.key + ':\u2019 here. ' + b.e;
    } else {
      b.h = 'The whole content of this line is missing. What the line does: ' + b.e;
    }
    if(!b.e) b.e = 'This piece belongs on line ' + pb.line + ' of ' + file.name + '.';
    return b;
  });
}
function playInputHTML(i, b){
  var size = Math.max(4, Math.min(64, b.b.length + 2));
  var val = (cur && cur.values[i] != null) ? cur.values[i] : '';
  var dis = cur && cur.reveals.has(i) ? ' disabled' : '';
  var html = '<input class="blank' + blankStateClass(i) + '" data-i="' + i + '" size="' + size + '" value="' + esc(val) + '" autocomplete="off" autocapitalize="off" spellcheck="false"' + dis + '>';
  html += '<span class="bbtns"><button data-act="hint" data-i="' + i + '" title="Hint">💡</button><button data-act="reveal" data-i="' + i + '" title="Reveal">👁</button></span>';
  return html;
}
function renderPlayCode(file, level){
  var html = '<div class="vimwrap"><div class="vimbar"><span class="vfile">📄 ' + esc(file.path) + '</span></div>';
  if(level === 3){
    curPlayBlanks = []; curLines = {}; curCols = {};
    var rows = Math.max(3, playLineList(file).length);
    var v3 = (cur && cur.values[0] != null) ? cur.values[0] : '';
    html += '<div class="codebox"><textarea class="blank scratch' + (cur && cur.l3bad ? ' bad' : '') + '" data-i="0" rows="' + rows + '" autocomplete="off" autocapitalize="off" spellcheck="false">' + esc(v3) + '</textarea></div></div>';
    return html;
  }
  var lines = playLineList(file);
  var parsed = lines.map(function(l){ return parsePlayLine(l, file.lang); });
  curPlayBlanks = enrichPlayBlanks(file, level);
  curLines = {}; curCols = {};
  var byLine = {};
  curPlayBlanks.forEach(function(b, i){ byLine[b.line] = i; curLines[i] = b.line; curCols[i] = 1; });
  html += '<div class="codebox">';
  lines.forEach(function(line, li){
    html += '<div class="ln" data-line="' + (li+1) + '"><span class="no">' + (li+1) + '</span><span class="lc">';
    var p = parsed[li], bi = byLine[li+1];
    if(bi == null){ html += hlLine(file.lang, line); }
    else if(level === 1){
      html += esc(p.indent);
      if(p.dash) html += '<span class="tk-dash">-</span>' + esc(p.dash.slice(1));
      html += playInputHTML(bi, curPlayBlanks[bi]);
      html += '<span class="tk-colon">:</span>';
      if(p.value) html += esc(p.sep || ' ') + hlValue(p.value);
    } else if(p.kind === 'map'){
      html += esc(p.indent);
      if(p.dash) html += '<span class="tk-dash">-</span>' + esc(p.dash.slice(1));
      html += '<span class="tk-key">' + esc(p.key) + '</span><span class="tk-colon">:</span> ';
      html += playInputHTML(bi, curPlayBlanks[bi]);
    } else {
      html += esc(p.prefix);
      html += playInputHTML(bi, curPlayBlanks[bi]);
    }
    html += '</span></div>';
  });
  html += '</div></div>';
  return html;
}

}

    var cm = l.match(/^\s*(tasks|roles|post_tasks|collections|users):\s*$/);
    if(cm && (pending === null || indent < pending)) pending = indent + 2;
    if(pending !== null && indent === pending && /^- /.test(l.slice(indent))) starts.push(i);
  });
  if(!starts.length){
    lines.forEach(function(l, i){
      var indent = l.length - l.replace(/^\s+/, '').length;
      if(indent === 0 && l.trim() && l.trim() !== '---') starts.push(i);
    });
    if(starts.length === 1 && lines.length > 7){
      starts = [];
      lines.forEach(function(l, i){
        var indent = l.length - l.replace(/^\s+/, '').length;
        if(i > 0 && indent === 2 && l.trim()) starts.push(i);
      });
    }
  }
  if(!starts.length) starts = [0];
  var sections = [];
  var bounds = starts.slice();
  if(bounds[0] > 0) bounds.unshift(0);
  bounds.forEach(function(start, bi){
    var end = (bi + 1 < bounds.length) ? bounds[bi + 1] : lines.length;
    var slice = lines.slice(start, end);
    var firstContent = slice.filter(function(l){ return l.trim() && l.trim() !== '---'; })[0] || '';
    var title;
    var nm = firstContent.match(/name:\s*(.+)$/);
    var isHeader = (bi === 0 && starts[0] > 0);
    if(isHeader) title = 'The header — the stage everything else stands on';
    else if(nm) title = nm[1].replace(/^["']|["']$/g, '');
    else title = firstContent.trim().slice(0, 60);
    var modKey = null;
    slice.forEach(function(l){ var k = l.trim().match(/^((?:ansible|community|redhat)\.[\w.]+):/); if(k && !modKey) modKey = k[1]; });
    var why;
    if(isHeader) why = 'Read this first: it decides WHERE the rest runs, as WHOM, and with what data loaded. Nothing below it makes sense without it.';
    else if(modKey){ var sm = MODULES[modKey.split('.').pop()]; why = sm ? ('What this section does: ' + sm.what + ' What breaks without it: ' + sm.breaks) : 'One self-contained step of the file.'; }
    else why = 'One self-contained block of the file: its lines belong together and are read together.';
    var rows = [];
    slice.forEach(function(l, sidx){ if(l.trim()) rows.push([l.trim(), explainLine(l, file), start + sidx + 1]); });
    sections.push({title: title, why: why, rows: rows, code: slice.join('\n')});
  });
  return sections;
}

function renderStudyBreakdown(f){
  var ov = STUDY_OVERRIDES[f.id];
  var secs, overall;
  if(ov){
    var lnCounter = 1;
    secs = ov.sections.map(function(s){
      return {title: s.title, why: s.why, code: null, rows: s.rows.map(function(r){ return [r[0], r[1], lnCounter++]; })};
    });
    overall = ov.overall;
  }
  else {
    secs = splitSections(f);
    overall = f.blueprint + ' ' + f.summary;
  }
  curGlossMap = {};
  secs.forEach(function(s){
    s.rows.forEach(function(r){ curGlossMap[r[2]] = {code: r[0], gloss: r[1], sec: s.title}; });
  });
  var html = '<div class="card studyflow"><h3>How it all works together</h3><p>' + esc(overall) + '</p>';
  html += '<ol class="flowsteps">' + secs.map(function(s){ return '<li>' + esc(s.title) + '</li>'; }).join('') + '</ol></div>';
  html += '<p class="levelhead">Section by section — every line explained</p>';
  secs.forEach(function(s, si){
    html += '<div class="seccard"><h3><span class="secno">§' + (si + 1) + '</span>' + esc(s.title) + '</h3>';
    if(s.why) html += '<p class="secwhy">' + esc(s.why) + '</p>';
    if(s.code) html += '<div class="seccode"><pre>' + s.code.split('\n').map(function(l){ return hlLine(f.lang, l); }).join('\n') + '</pre></div>';
    s.rows.forEach(function(r){
      html += '<div class="gloss" id="gl-' + r[2] + '" data-gline="' + r[2] + '"><code>' + esc(r[0]) + '</code><br>' + esc(r[1]) + '</div>';
    });
    html += '</div>';
  });
  return html;
}

}

on enables gpgcheck with the key. That mismatch is itself an exam-style trap — know both, follow your corrected version.", "Two near-identical repo blocks invite copy-paste slips: the BaseOS URL parked under the AppStream name. Name, description and baseurl must travel together.", "'on all managed hosts' becomes the 'all' pattern in every ad hoc line — one repo per command."], "dissect": [["Create a shell script called /home/student/ansible/repo.sh that uses Ansible ad hoc commands", "repo.sh containing ansible all -m yum_repository … lines", "File TYPE is the trap: a script of commands, not YAML tasks."], ["Repository Name: BaseOS / Description: BaseOS Repo", "name=BaseOS, description='BaseOS Repo'", "Name and description are different fields with deceptively similar values."], ["Base URL: http://10.1.14.36/RHEL9/BaseOS", "baseurl=http://10.1.14.36/RHEL9/BaseOS", "Transcribe the URL character-exact — the two repos differ only in the last segment."], ["Enabled: Yes", "enabled=yes (with state=present)", "The paper's 'Yes' becomes a boolean in the module."], ["GPG Check: Disabled / GPG Key: None (paper)", "gpgcheck + gpgkey per your governing version", "See the trap above: paper says Disabled/None; your corrected playbook enables the check with the key URL."]]}, "3": {"skeleton": "packages.yml: one play (hosts: all) + three tasks, each fenced by its own when: — the group sets are the whole question.", "question": "3. Manage Packages and Package Groups Using a Playbook\n\nCreate a playbook called /home/student/ansible/packages.yml. The playbook must perform the following tasks:\n• Install the php and mariadb packages on hosts in the dev, test, and prod groups\n• Install the RPM Development Tools package group on hosts in the dev group\n• Update all packages to the latest version on hosts in the dev group", "traps": ["Three bullets, three DIFFERENT host sets: php+mariadb go to dev+test+prod; the package GROUP goes to dev only; the full update goes to dev only. Blending the sets is the fail.", "'RPM Development Tools' is a package GROUP, not a package — it needs the @ group syntax, not a plain name in a package list.", "'Update ALL packages to the latest' is a different task shape from installing named packages: wildcard name + state latest."], "dissect": [["Install php and mariadb on dev, test, and prod", "yum name: [php, mariadb] + when: in groups['dev'] or ['test'] or ['prod']", "The group list becomes an or-chain — one task covering three groups."], ["Install the RPM Development Tools package group on dev", "yum name: '@RPM Development Tools', when: dev only", "The @ is what makes it a group install instead of a hunt for a package literally named that."], ["Update all packages to the latest version on dev", "yum name: '*', state: latest, when: dev only", "'All' + 'latest' translate to the wildcard + state pair."]]}, "4": {"skeleton": "requirements.yml (three collection names) + ONE galaxy command: -r the file, -p the collections directory.", "question": "4. Install Collections Using Ansible Galaxy\n\nUse a requirements file located at /home/student/ansible/collections/requirements.yml to download and install the following Ansible Galaxy collections to /home/student/ansible/collections:\n• community.general\n• ansible.posix\n• ansible.netcommon", "traps": ["The requirements file's LOCATION is the question — it must sit at /home/student/ansible/collections/requirements.yml, the same collections path Q1 wrote into ansible.cfg, or nothing in this project finds it.", "Installing is a single command — and the -p flag is what makes the collections land in the project directory instead of your home's ~/.ansible/collections, where this project never looks."], "dissect": [["requirements file located at /home/student/ansible/collections/requirements.yml", "Write requirements.yml AT that path", "The path arrives split across lines mid-sentence — reassemble it before anything else."], ["community.general / ansible.posix / ansible.netcommon", "collections:\n  - community.general\n  - ansible.posix\n  - ansible.netcommon", "Three list items under one key — fully-qualified names, transcribed exactly."], ["download and install … to /home/student/ansible/collections", "ansible-galaxy collection install -r requirements.yml -p /home/student/ansible/collections", "-r is the shopping list, -p is the pantry shelf."]]}, "5": {"skeleton": "Install rhel-system-roles first; then timesync.yml = hosts: all + role variables (one server, iburst true) + a single roles: line. No hand-written tasks.", "question": "5. Use RHEL System Role to Configure Time Synchronization\n\nInstall the rhel-system-roles package on the control node.\nCreate a playbook called /home/student/ansible/timesync.yml that does the following:\n• Runs on all managed hosts\n• Uses the timesync role\n• Configures the role to use the time server 2.north-america.pool.ntp.org\n• Configures the role to set the iburst parameter as enabled", "traps": ["Step zero hides BEFORE the playbook: without the rhel-system-roles package on the control node, the role doesn't exist and the playbook dies instantly.", "A system role is configured by VARIABLES, not tasks — the play is hosts + vars + one roles: line. Writing your own chrony tasks answers a question nobody asked.", "iburst is a flag INSIDE the single server's entry, not a global setting beside the list."], "dissect": [["Runs on all managed hosts", "hosts: all", "Managed hosts = the whole inventory."], ["use the time server 2.north-america.pool.ntp.org", "timesync_ntp_servers:\n  - hostname: 2.north-america.pool.ntp.org", "With roles, the server is DATA in a variable — there is no 'install NTP' task to write."], ["set the iburst parameter as enabled", "iburst: true — inside that server entry", "Placement is the grade: nested under the server dict, not next to it."], ["Uses the timesync role", "roles:\n  - rhel-system-roles.timesync", "The role name carries its package prefix — rhel-system-roles.timesync, not just timesync."]]}, "6": {"skeleton": "roles/requirements.yml: two src/name pairs (download name ≠ local name) + one galaxy install command with -r and -p.", "question": "6. Install Roles Using Ansible Galaxy\n\nUse a requirements file located at /home/student/ansible/roles/requirements.yml to download and install the following roles to /home/student/ansible/roles:\n• geerlingguy.haproxy — the name of this role should be balancer\n• geerlingguy.php — the name of this role should be phpinfo", "traps": ["The download name and the LOCAL name differ on purpose: geerlingguy.haproxy must answer to 'balancer'. The rename is the entire question — Q8 will call these roles balancer and phpinfo, never geerlingguy.*.", "Swap src and name and the install still 'works' — under the wrong name, so the failure surfaces two questions later in Q8. Cross-question wiring punishes a Q6 slip at Q8 prices."], "dissect": [["geerlingguy.haproxy — the name of this role should be balancer", "src: geerlingguy.haproxy\nname: balancer", "Galaxy installs by src; your playbooks call by name. Both fields, in that order."], ["geerlingguy.php — the name of this role should be phpinfo", "src: geerlingguy.php\nname: phpinfo", "Same pattern, second row — build the pair table before typing."], ["download and install … to /home/student/ansible/roles", "ansible-galaxy role install -r roles/requirements.yml -p /home/student/ansible/roles", "Same command shape as Q4: -r the list, -p the shelf."]]}, "7": {"skeleton": "roles/apache: tasks = httpd package → httpd service → firewalld (service + http rule) → template. role.yml: hosts webservers, roles [apache].", "question": "7. Create and Use a Role to Deploy a Web Server\n\nCreate a role named apache in /home/student/ansible/roles. The role must perform the following:\n• Install the httpd package\n• Enable and start the httpd service on boot\n• Ensure the firewall is enabled and running with a rule to allow access to the web server\n• Create a template file called index.html.j2 that outputs: Welcome to HOSTNAME and the IP Address is IPV4ADDRESS\n• Use the template to generate /var/www/html/index.html on the managed hosts\nCreate a playbook called /home/student/ansible/role.yml that runs this role on hosts in the webservers host group", "traps": ["Four jobs hide inside one role: package, service, firewall, template. The firewall job is itself three ideas — firewalld must be installed and running BEFORE its module can talk to it, and the rule must be permanent AND immediate.", "HOSTNAME and IPV4ADDRESS in the output line are placeholders for FACTS, not literal words — printing them verbatim produces a page that literally says 'HOSTNAME'.", "'Enable and start on boot' is two switches: enabled: true AND state: started. One without the other is half the requirement."], "dissect": [["Install the httpd package; enable and start the httpd service", "yum: httpd — then service: name httpd, enabled: true, state: started", "Package and service share a name but are separate tasks."], ["firewall enabled and running, rule to allow access to the web server", "firewalld service up; ansible.posix.firewalld: service: http, permanent: true, immediate: true, state: enabled", "http is a predefined firewalld service bundle (port 80) — pass the bundle name, service: not name:."], ["outputs: Welcome to HOSTNAME and the IP Address is IPV4ADDRESS", "index.html.j2: Welcome to {{ ansible_hostname }} and the IP Address is {{ ansible_default_ipv4.address }}", "Capitalized placeholders in the paper are fact names in disguise."], ["generate /var/www/html/index.html on the managed hosts", "template: src: index.html.j2, dest: /var/www/html/index.html", "The .j2 lives in the role's templates/; the rendered file drops the .j2."], ["role.yml runs this role on hosts in the webservers group", "hosts: webservers, roles: [apache]", "Thanks to Q1's nesting, webservers quietly includes prod — more hosts than the sentence names."]]}, "8": {"skeleton": "Download 4 files to exact homes → edit vars (two backend entries) → roles fenced by when: → post_tasks tail for the php packages. The browsing paragraphs are the answer key, not tasks.", "question": "8. Use Galaxy Roles in a Playbook\n\nDownload the following files from the exam server and place them in the correct locations:\n• Download http://10.1.10.121/roles.yml and save it as /home/student/ansible/roles.yml\n• Download http://10.1.10.121/haproxy.cfg.j2 and place it inside the templates/ directory of the balancer role\n• Download http://10.1.10.121/hello.php.j2 and place it inside the templates/ directory of the phpinfo role\n• Download http://10.1.10.121/main.yml and place it inside the tasks/ directory of the phpinfo role\nOpen roles.yml and add the IP addresses of serverb and serverc to the haproxy_backend_servers variable in the vars section.\nComplete the playbook so that it runs on all hosts and does the following:\n• Applies the balancer role only on hosts in the balancers host group\n• Applies the phpinfo role only on hosts in the webservers host group\nWhen implemented, browsing to hosts in the balancers host group (e.g. http://serverd.lab.example.com) should produce: 'Welcome to serverb.lab.example.com and the IP Address is 172.25.250.11'. Reloading the browser should return output from the alternate web server: 'Welcome to serverc.lab.example.com and the IP Address is 172.25.250.12'.\nBrowsing to http://serverb.lab.example.com/hello.php should produce 'Hello PHP World from serverb.lab.example.com' along with details of the PHP configuration; similarly for serverc.", "traps": ["Half the question is DOWNLOADS with exact destinations — the templates go INSIDE each role's templates/ directory and main.yml inside phpinfo's tasks/. Right file, wrong directory = silently broken role.", "The long 'browsing to… should produce…' paragraphs are VERIFICATION, not tasks — but they smuggle in the graded data: the backend FQDNs and IPs (172.25.250.11 / .12) you must type into the vars.", "'only on' twice means when: conditions ON THE ROLES. Run either role everywhere and the 'only' fails — and in your governing version roles.yml has NO tasks: section; the php packages ride in post_tasks with their own when:."], "dissect": [["Download http://10.1.10.121/roles.yml and save it as /home/student/ansible/roles.yml", "get_url (or curl) to that exact path", "The playbook is handed to you half-built — you complete it, not write it."], ["place haproxy.cfg.j2 inside the templates/ directory of the balancer role", "dest: roles/balancer/templates/haproxy.cfg.j2", "Roles locate templates by directory convention — the folder IS the addressing."], ["add the IP addresses of serverb and serverc to haproxy_backend_servers in vars", "backend entries: serverb.lab.example.com 172.25.250.11; serverc.lab.example.com 172.25.250.12", "The IPs are not in this paragraph — they hide in the verification text below and in your lab defaults."], ["Applies the balancer role only on hosts in the balancers group", "role balancer + when: inventory_hostname in groups['balancers']", "'Only' is always a when: — on a role, it nests under the role entry."], ["Applies the phpinfo role only on hosts in the webservers group", "role phpinfo + when: inventory_hostname in groups['webservers']", "webservers includes prod by nesting — serverb/serverc earn phpinfo through prod."], ["browsing to http://serverd… should produce 'Welcome to serverb…'", "(no task — verification text)", "This paragraph grades YOU. It's the answer key for the vars above, not new work."]]}, "9": {"skeleton": "lvm.yml: fail guard first → block [lvol 1500m] / rescue [message + lvol 800m] → filesystem ext4 on the LV path. NO mount task — deliberately.", "question": "9. Create and Use a Partition with LVM and Error Handling\n\nCreate a playbook called /home/student/ansible/lvm.yml that runs on all managed nodes and does the following:\n• Creates a logical volume with these requirements:\n  – The logical volume should be created in the yellowtail volume group\n  – The logical volume name is data\n  – The logical volume size is 1500 MiB\n• Formats the logical volume with the ext4 filesystem\n• The logical volume should not be mounted on any managed host\n• If the requested logical volume size cannot be created, the error message 'Could not create logical volume at that size' should be displayed and a size of 800 MiB should be used instead\n• If the volume group yellowtail does not exist, the error message 'Volume group does not exist' should be displayed", "traps": ["The existence check comes FIRST in logic: if yellowtail is missing, your play must print 'Volume group does not exist' and stop — check before any LVM task runs, or the play dies with a raw module error instead of your message.", "'should NOT be mounted' is a graded ABSENCE: the correct move is to write no mount task at all. Adding one 'to be thorough' fails the question.", "Two different failures, two different handlings: missing VG → message + stop; size too big → message + retry at 800. block/rescue is the skeleton — if your structure can't express both, it's wrong.", "Both messages are graded word-for-word, capitals included. Paraphrase = zero."], "dissect": [["If the volume group yellowtail does not exist, display 'Volume group does not exist'", "ansible.builtin.fail with that msg + when: 'yellowtail' not in ansible_lvm.vgs", "The fail module's only job is to lose on purpose — it stops the play carrying YOUR message instead of a crash."], ["created in the yellowtail volume group, name is data, size is 1500 MiB", "community.general.lvol: vg: yellowtail, lv: data, size: 1500m", "Read the module as pool / tank-name / amount: vg, lv, size — in that order, every time."], ["If the size cannot be created, display 'Could not create logical volume at that size' and use 800 MiB instead", "block: lvol 1500m — rescue: debug with the message + lvol 800m", "block/rescue is try/except for playbooks. The rescue PRINTS by design — it is not a silent recovery."], ["Formats the logical volume with the ext4 filesystem", "community.general.filesystem: fstype: ext4, dev: <the LV Path>", "Never type the device path from memory — read it from lvdisplay's LV Path (or lvs -o +lv_path) and cross-check with blkid."], ["The logical volume should not be mounted on any managed host", "(nothing — no task)", "A graded absence. The skill being tested is restraint."]]}, "10": {"skeleton": "hosts.j2: keep the 2 preset localhost lines, add ONE loop over groups['all'] printing hostvars columns. hosts.yml: hosts dev, template → /etc/myhosts.", "question": "10. Generate a Hosts File from a Template\n\nDownload the initial template file hosts.j2 from http://10.1.10.121/hosts.j2 and save it to /home/student/ansible/.\nComplete the hosts.j2 template so that it can be used to generate a file with one line per inventory host in the same format as /etc/hosts.\nCreate a playbook called /home/student/ansible/hosts.yml that uses the completed template to generate the file /etc/myhosts on hosts in the dev host group.\nWhen completed, the file /etc/myhosts on hosts in the dev group should contain:\n127.0.0.1 localhost localhost.localdomain localhost4 localhost4.localdomain4\n::1 localhost localhost.localdomain localhost6 localhost6.localdomain6\n172.25.250.10 servera.lab.example.com servera\n172.25.250.11 serverb.lab.example.com serverb\n172.25.250.12 serverc.lab.example.com serverc\n172.25.250.13 serverd.lab.example.com serverd", "traps": ["You COMPLETE a downloaded template — the two localhost lines already live in hosts.j2. Rewriting the file from scratch throws away given work and the exact format.", "The line format is /etc/hosts grammar: IP, then the canonical FQDN, then the short alias. That column ORDER is what's graded — all three values come from the same host, so the row can never mix hosts.", "Target ≠ content: the play runs ONLY on dev, yet the file it generates lists every host. Reading 'dev' as 'only servera's line' shrinks the file wrong."], "dissect": [["Complete the hosts.j2 template … one line per inventory host", "{% for x in groups['all'] %} … {% endfor %} around one line pattern", "One loop walks the whole inventory. Your governing version fixes the loop variable as x — keep it."], ["172.25.250.11 serverb.lab.example.com serverb", "hostvars[x] IP + hostvars[x] FQDN + hostvars[x] hostname on ONE line", "Outer pass walks hosts (rows); inner order follows the old /etc/hosts grammar (columns) — all read from the same hostvars[x]."], ["generate the file /etc/myhosts on hosts in the dev host group", "hosts.yml: hosts: dev; template: src: hosts.j2, dest: /etc/myhosts", "The play's hosts: line is dev even though the file describes all four hosts."]]}, "11": {"skeleton": "issues.yml: hosts: all + three copy tasks that each overwrite /etc/issue with one line, fenced by dev / test / prod when: conditions.", "question": "11. Modify File Content Based on Host Group\n\nCreate a playbook called /home/student/ansible/issues.yml.\nThe playbook runs on all inventory hosts.\nThe playbook replaces the contents of /etc/issue with a single line of text as follows:\n• On hosts in the dev host group, the line reads: Development\n• On hosts in the test host group, the line reads: Test\n• On hosts in the prod host group, the line reads: Production", "traps": ["serverb belongs to test AND prod — both its tasks match, so the LAST matching task wins /etc/issue. Task order is logic here, not style: your governing order (dev, test, prod) decides dual-group hosts.", "'REPLACES the contents … with a single line' — anything that appends under the old text fails. Overwrite semantics is the requirement.", "Three one-word strings, graded exactly: Development / Test / Production. Note dev's word is the long form — 'Dev' fails."], "dissect": [["The playbook runs on all inventory hosts", "hosts: all", "Every host receives exactly one of the three lines."], ["On dev: 'Development'; test: 'Test'; prod: 'Production'", "copy: dest: /etc/issue, content: 'Development' + when: in groups['dev'] — ×3", "Three near-identical tasks; the when: is the only difference, and it is the graded part."], ["replaces the contents of /etc/issue", "copy with content: (overwrite), not lineinfile", "copy replaces wholesale by nature — the module choice IS the translation of 'replaces'."]]}, "12": {"skeleton": "webcontent.yml: hosts dev — file task (dir /webdev, group devops, mode '2775') → link task (src /webdev/ → dest /var/www/html/webdev) → copy 'Development' into /webdev/index.html.", "question": "12. Create a Web Content Directory with Proper Permissions\n\nCreate a playbook called /home/student/ansible/webcontent.yml that runs on managed nodes in the dev host group.\nCreate the directory /webdev with the following requirements:\n• Group ownership should be given to the devops group\n• Regular permissions: owner = read/write/execute, group = read/write/execute, other = read/execute\n• Special permissions: set group ID (SGID)\nSymbolically link /var/www/html/webdev to /webdev.\nCreate the file /webdev/index.html containing a single line of text that reads: Development", "traps": ["The permissions arrive as WORDS and must leave as a NUMBER: rwx + rwx + r-x = 775, SGID adds the leading 2 → '2775' — and it must be QUOTED, because an unquoted 2775 is a plain number and YAML will not treat it as an octal mode.", "The symlink reads backwards from instinct: /var/www/html/webdev is the LINK you create; /webdev is the target it points at. 'Link A to B' means src: B, dest: A.", "The content word is 'Development' again — the same string as Q11's dev banner. The exam reuses its own vocabulary across questions; recognizing it saves reading time."], "dissect": [["Create the directory /webdev, group ownership to devops", "file: path: /webdev, state: directory, group: devops", "Directory, ownership and mode ride in ONE file task."], ["owner rwx, group rwx, other r-x + Special permissions: SGID", "mode: '2775'", "7-7-5 with the SGID 2 in front. Quote it — the quotes are part of the answer."], ["Symbolically link /var/www/html/webdev to /webdev", "file: src: /webdev/, dest: /var/www/html/webdev, state: link, force: true", "src is the real directory (trailing slash in your governing version); the link lives in the web root. force: true keeps re-runs clean."], ["file /webdev/index.html containing a single line: Development", "copy: dest: /webdev/index.html, content: 'Development'", "One line, exact word — same string as Q11's dev line."]]}, "13": {"skeleton": "hwreport.yml: get_url the empty template → /root/hwreport.txt, then FIVE lineinfile tasks, one per key, values pulled from facts with default('NONE').", "question": "13. Generate a Hardware Report\n\nCreate a playbook called /home/student/ansible/hwreport.yml that produces an output file called /root/hwreport.txt on all managed nodes with the following information:\n• Inventory host name\n• Total memory in MB\n• BIOS version\n• Size of disk device vda\n• Size of disk device vdb\nEach line of the output file contains a single key=value pair.\nYour playbook should:\n• Download the file hwreport.empty from http://10.1.10.121/hwreport.empty and save it as /root/hwreport.txt\n• Modify /root/hwreport.txt with the correct values using Ansible facts\n• If a hardware item does not exist, the associated value should be set to NONE", "traps": ["Download FIRST, then modify IN PLACE: the empty file already carries the exact key labels; five lineinfile tasks rewrite each value. Writing a fresh file with copy throws away the given labels.", "Paper vs playbook label trap: the paper names the disks vda/vdb, but YOUR governing playbook reads ansible_devices sda/sdb and prints sda/sdb labels. Learn the fact PATH and the default() pattern — and follow your governing version.", "'If a hardware item does not exist → NONE' is the default('NONE') filter on every value. Without it, a host missing the second disk crashes the play instead of printing NONE."], "dissect": [["Download hwreport.empty … save it as /root/hwreport.txt", "get_url: url: http://10.1.10.121/hwreport.empty, dest: /root/hwreport.txt", "get_url fetches a file; its sibling uri talks to APIs. The exam grades the distinction."], ["Modify /root/hwreport.txt with the correct values using Ansible facts", "five lineinfile tasks — line: 'KEY={{ fact }}' — one per key", "Five separate lineinfile tasks (not one replace): each owns exactly one labeled line."], ["Inventory host name / Total memory in MB / BIOS version", "{{ inventory_hostname }} / {{ ansible_memtotal_mb }} / {{ ansible_bios_version }}", "The fact names barely resemble their labels — that gap is the question. Learn these three cold."], ["Size of disk device … / if it does not exist, set NONE", "{{ ansible_devices['sda']['size'] | default('NONE') }}", "default() is the safety net that converts a missing disk into the graded string NONE."]]}, "14": {"skeleton": "Two files: secret.txt holding only 'redhat123' (mode 600), then ansible-vault create locker.yml containing pw_developer/pw_manager.", "question": "14. Create a Password Vault File\n\nCreate an Ansible vault to store user passwords as follows:\n• The name of the vault is /home/student/ansible/locker.yml\n• The vault contains two variables: pw_developer with value Imadev; pw_manager with value Imamgr\n• The password to encrypt and decrypt the vault is redhat123\n• The password is stored in the file /home/student/ansible/secret.txt", "traps": ["THREE artifacts, one question: the password VALUE (redhat123), the password FILE (secret.txt), and the VAULT (locker.yml). Mixing up which file holds what is the classic fumble — and Q15 spends all three.", "secret.txt holds ONLY the password — an extra line or note in it corrupts every later vault read.", "The variables live INSIDE the encrypted file. Writing locker.yml as plain YAML and moving on leaves a 'vault' anyone can cat — if you can read it in plain text, it's wrong."], "dissect": [["The password … is redhat123, stored in /home/student/ansible/secret.txt", "secret.txt containing only: redhat123 (mode '600' in your version)", "This file is what later commands point at with --vault-password-file. Lock it down; keep it to one line."], ["vault is /home/student/ansible/locker.yml, containing pw_developer: Imadev, pw_manager: Imamgr", "ansible-vault create locker.yml with those two variables inside", "Names and values graded exactly — Imadev / Imamgr, capitals included."], ["Create an Ansible vault to store user passwords", "The finished file starts with $ANSIBLE_VAULT;1.1;AES256", "cat the result: encrypted gibberish = correct; readable YAML = start over."]]}, "15": {"skeleton": "users.yml: vars_files loads user_list.yml AND locker.yml → two user tasks (developer / manager), each looping the list with a job+group when:, passwords hashed sha512. Run with --vault-password-file secret.txt.", "question": "15. Create User Accounts\n\nDownload the file user_list.yml from http://10.1.10.121/user_list.yml and save it to /home/student/ansible/.\nUsing the password vault /home/student/ansible/locker.yml created elsewhere in this exam, create a playbook called /home/student/ansible/users.yml that creates user accounts as follows:\n• Users with a job description of developer should be: created on managed nodes in the dev and test host groups; assigned the password from the pw_developer variable; a member of supplementary group devops\n• Users with a job description of manager should be: created on managed nodes in the prod host group; assigned the password from the pw_manager variable; a member of supplementary group opsmgr\n• Passwords should use the SHA512 hash format\n• Your playbook should work using the vault password file created elsewhere in this exam", "traps": ["This question SPENDS Q14: no locker.yml, no secret.txt, no playbook. 'created elsewhere in this exam' is the exam telling you the dependency out loud.", "The mapping is a three-way table — job → host groups + password variable + supplementary group: developer → dev+test / pw_developer / devops; manager → prod / pw_manager / opsmgr. One wrong cell fails that row for every user in it.", "Passwords must be HASHED at task time: password_hash('sha512') around the vault value. Dropping the raw vault string into the password field stores the wrong bytes and no login works.", "The user list is DATA to loop over (item.job, item.name…) — hand-writing four user tasks ignores the downloaded file the question made you fetch."], "dissect": [["Download user_list.yml … using the vault locker.yml", "vars_files:\n  - user_list.yml\n  - locker.yml", "Two data files: WHO is a developer lives in one; WHAT their password is lives in the other. The play joins them."], ["developer → dev and test groups, pw_developer, supplementary group devops", "user task: groups: devops, password: \"{{ pw_developer | password_hash('sha512') }}\", loop + when: (job developer and host in dev) or (job developer and host in test)", "One looped task — the when: carries the job AND the host's group together."], ["manager → prod host group, pw_manager, opsmgr", "second user task, mirrored: groups: opsmgr, pw_manager hashed, when: job manager and host in prod", "Same shape, second row of the table. Build the table in your head before you type either task."], ["Passwords SHA512 + work using the vault password file", "password_hash('sha512') in the task; run: ansible-navigator run users.yml --vault-password-file secret.txt (or ansible-playbook equivalent)", "The hash happens inside the task; the vault unlock happens in the RUN command. Two different moments — both graded."]]}, "16": {"skeleton": "Download sal.yml, then ONE command: ansible-vault rekey — old password first (insecure4sure), new second (secure1234). The file never sits decrypted.", "question": "16. Rekey an Ansible Vault\n\nDownload the Ansible vault from http://10.1.10.121/sal.yml and save it as /home/student/ansible/sal.yml.\nRekey the vault as follows:\n• The current vault password is insecure4sure\n• The new vault password is secure1234\n• The vault remains in an encrypted state with the new password", "traps": ["The seductive wrong path: decrypt → edit → re-encrypt. Your trainer fails that route by design — rekey is a single atomic command that swaps the password while the file stays encrypted throughout.", "Both passwords are printed in plain text and look alike in shape — swapping them rekeys the vault INTO the old password and out of the required state.", "'remains in an encrypted state' is a checkable end-state: if sal.yml is readable text at the end, the question failed even if a password changed hands."], "dissect": [["Download the Ansible vault from http://10.1.10.121/sal.yml", "get_url / curl → /home/student/ansible/sal.yml", "Fetch first — rekey operates on the local file."], ["current password insecure4sure; new password secure1234", "ansible-vault rekey sal.yml — answer old first, then new", "The prompt order is the whole skill: current unlocks, new locks."], ["The vault remains in an encrypted state with the new password", "Verify: head sal.yml still shows $ANSIBLE_VAULT", "Rekey never leaves a decrypted copy on disk — that is the entire difference from the decrypt/encrypt trap."]]}};
function renderExamLens(f){
  var html = '<p class="levelhead">🎯 Exam lens — read the question the way the exam wrote it: skeleton first, traps second, then watch each phrase turn into playbook. This is the speed skill: 150 minutes, 16 questions, no time to re-read.</p>';
  html += '<div class="card tactics"><h3>🎭 How exam questions are built to confuse you</h3><ol>' + EXAM_TACTICS.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ol></div>';
  var L = EXAM_LENS[f.q];
  if(f.q === 0 || !L){
    html += '<div class="card"><h3>📋 The original question</h3><p>Q0 is your own pre-exam setup (the .vimrc from your training), not a numbered exam question — there is no paper text for it. Its exam-lens lesson: the real exam assumes your editor is already tamed before the clock starts.</p></div>';
    return html;
  }
  html += '<div class="card qcard"><h3>📋 The original question — Practice Exam 1, Q' + f.q + '</h3><div class="qtext">' + esc(L.question).replace(/\n/g, '<br>') + '</div></div>';
  html += '<div class="card"><h3>⏱ The 20-second skeleton</h3><p>' + esc(L.skeleton) + '</p></div>';
  html += '<div class="card traps"><h3>🪤 How THIS question tries to trip you</h3><ul>' + L.traps.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
  html += '<div class="card dissect"><h3>🔪 Dissection — phrase by phrase into the playbook</h3>';
  L.dissect.forEach(function(r){
    html += '<div class="drow"><div class="dfrom">\u201c' + esc(r[0]) + '\u201d</div><div class="darrow">\u2b07 becomes</div><div class="dto"><code>' + esc(r[1]).replace(/\n/g, '<br>') + '</code></div><div class="dnote">' + esc(r[2]) + '</div></div>';
  });
  html += '<p class="small">On exam day, read in this order: skeleton (file \u2192 hosts \u2192 modules), traps, details last. That order is what makes 9 minutes per question enough.</p></div>';
  return html;
}

function modebarHTML(f){
  var top = fileTop(f), lp = fprog(f), h = '<div class="modebar">';
  h += '<button data-act="study" class="' + (cur.mode === 'study' ? 'active' : '') + '">📖 Study</button><button data-act="exam" class="' + (cur.mode === 'exam' ? 'active' : '') + '">🎯 Exam lens</button>';
  for(var L = 1; L <= top; L++){
    var st = lp.levels[L];
    h += '<button data-act="level" data-l="' + L + '" class="' + (cur.mode === 'play' && cur.level === L ? 'active' : '') + '">▶ Level ' + L + (L === 1 ? ' · keys' : L === 2 ? ' · values' : ' · from scratch') + (st && st.done ? ' ✓' : '') + '</button>';
  }
  h += '</div>';
  return h;
}

function renderFile(f){
  var html = '<div class="bigbtnrow"><button data-act="home">← All files</button><button data-act="shuffle">🔀 Shuffle</button></div>';
  html += '<div class="card"><h2>Q' + f.q + ' — ' + esc(f.name) + '</h2><div class="fpath" style="font-family:var(--mono);font-size:12px;color:var(--dim)">' + esc(f.path) + '</div></div>';
  html += '<div class="card spec"><h3>The task</h3><p>' + esc(f.spec) + '</p></div>';
  html += '<div class="card blueprint"><h3>Blueprint — the shape of this file</h3><p>' + esc(f.blueprint) + '</p></div>';
  html += '<div id="playarea"></div>';
  app.innerHTML = html;
  renderPlayArea();
  window.scrollTo(0, 0);
}

function renderPlayArea(){
  var f = cur.file, area = document.getElementById('playarea');
  var html = modebarHTML(f);
  if(cur.mode === 'study'){
    html += '<p class="levelhead">📖 Study — the complete file. Tap <b>anything</b> in the playbook — a <span style="color:#ffd75f">highlighted piece</span> or any other line — and I\u2019ll show its explanation here and scroll you straight to its matching definition below.</p>';
    html += renderCode(f, 99, 'study');
    html += '<div class="explainbox show" id="explainbox">Tap a highlighted piece above to see its explanation.</div>';
    html += renderStudyBreakdown(f);
  } else if(cur.mode === 'exam'){
    html += renderExamLens(f);
  } else {
    var top = fileTop(f);
    var desc = cur.level === 1 ? 'Keys missing, values shown: type the key name that belongs before each colon. Every value is given — only the labels are yours to supply.' : cur.level === 2 ? 'Values missing, keys shown: type what belongs after each colon, and fill the missing content lines. The structure is given — the values are yours.' : 'From scratch: an empty shell — no text, no hints. Write the entire file from memory, exactly as it should be — indentation counts.';
    html += '<p class="levelhead">Level ' + cur.level + ' of ' + top + ' — <span class="lvtag">' + desc + '</span></p>';
    html += renderCode(f, cur.level, 'play');
    if(cur.level < 3 && curPlayBlanks.length === 0) html += '<p class="small">Nothing to fill at this level for this file. Press \u2713 Check answers to complete the level.</p>';
    html += '<div class="bigbtnrow"><button class="primary" data-act="check">✓ Check answers</button><button data-act="study" class="ghost">Peek at Study view</button></div>';
    html += '<div class="feedback" id="feedback"></div><div id="completion"></div>';
  }
  area.innerHTML = html;
}

function startSession(f, mode, level){
  cur = {file:f, mode:mode, level:level || 1, hints:new Set(), reveals:new Set(), values:{}, results:{}};
  renderFile(f);
}
function harvest(){
  if(!cur) return;
  var els = app.querySelectorAll('.blank');
  els.forEach(function(el){ cur.values[el.getAttribute('data-i')] = el.value; });
}

// ---------- play actions ----------
function showFeedback(html){ var fb = document.getElementById('feedback'); if(fb){ fb.innerHTML = html; fb.classList.add('show'); } }
function doHint(i){
  harvest();
  var blanks = curPlayBlanks, b = blanks[i];
  if(!cur.hints.has(i)){ cur.hints.add(i); }
  if(cur.results[i] == null) cur.results[i] = undefined;
  renderPlayAreaKeep();
  showFeedback('<div class="item hintline"><b>💡 Hint — line ' + (curLines[i] || '?') + ':</b> ' + esc(b.h) + '</div>');
}
function doReveal(i){
  harvest();
  var blanks = curPlayBlanks, b = blanks[i];
  cur.reveals.add(i);
  cur.values[i] = b.b;
  delete cur.results[i];
  renderPlayAreaKeep();
  showFeedback('<div class="item"><b>👁 Revealed — line ' + (curLines[i] || '?') + '.</b> This piece will not count toward mastery at the top level. Its explanation: ' + esc(b.e) + '</div>');
}
function renderPlayAreaKeep(){
  var y = window.scrollY;
  renderPlayArea();
  window.scrollTo(0, y);
}
function doCheck(){
  harvest();
  var f = cur.file, level = cur.level;
  if(level === 3){
    var txt = cur.values[0] || '';
    if(gradeWholeText(fullTextOf(f), txt)){
      cur.l3bad = false;
      completeLevel();
    } else {
      cur.l3bad = true;
      renderPlayAreaKeep();
      var diff = diffWholeText(fullTextOf(f), txt);
      var dmsg = '<div class="item wrong"><b>\u2717 Not yet.</b> ' + diff.count + ' line(s) differ from the file \u2014 check the wording and the indentation (leading spaces count), and make sure no line is missing or extra.</div>';
      if(diff.lines.length) dmsg += '<div class="item">Differing line(s) in your text: ' + diff.lines.slice(0, 6).join(', ') + '.</div>';
      showFeedback(dmsg);
    }
    return;
  }
  var blanks = curPlayBlanks;
  var wrong = [], right = [];
  blanks.forEach(function(b, i){
    if(cur.reveals.has(i)){ right.push({b:b, i:i, revealed:true}); return; }
    var ok = gradeBlank(b, cur.values[i] || '');
    cur.results[i] = ok;
    if(ok) right.push({b:b, i:i}); else wrong.push({b:b, i:i});
  });
  renderPlayAreaKeep();
  var html = '';
  right.forEach(function(r){
    html += '<div class="item"><b>✓ Line ' + (curLines[r.i] || '?') + (r.revealed ? ' (revealed)' : '') + ':</b> ' + esc(r.b.e) + '</div>';
  });
  wrong.forEach(function(r){
    var msg = r.b.w ? r.b.w : 'Not quite — that is not what belongs there. Try the 💡 hint on that blank.';
    html += '<div class="item wrong"><b>✗ Line ' + (curLines[r.i] || '?') + ':</b> ' + esc(msg) + '</div>';
  });
  if(wrong.length === 0){
    completeLevel();
  } else {
    html = '<div class="item"><b>' + wrong.length + ' to fix.</b></div>' + html;
    showFeedback(html);
  }
}
function completeLevel(){
  var f = cur.file, level = cur.level, lp = fprog(f);
  var prev = lp.levels[level] || {};
  lp.levels[level] = {done:true, hints:cur.hints.size, reveals:cur.reveals.size, run: prev.run || false};
  var top = fileTop(f), masteredNow = false;
  if(level === top && cur.reveals.size === 0){ lp.mastered = true; masteredNow = true; }
  saveP();
  var html = '';
  if(level === 3){
    html += '<div class="item"><b>\u2713 Whole file, from memory:</b> every line and every indent matched the real ' + esc(f.name) + '.</div>';
  } else {
    curPlayBlanks.forEach(function(b, i){
      html += '<div class="item"><b>\u2713 Line ' + (curLines[i] || '?') + (cur.reveals.has(i) ? ' (revealed)' : '') + ':</b> ' + esc(b.e) + '</div>';
    });
  }
  showFeedback('<div class="item"><b>Level complete.</b> Here is what every piece you placed does:</div>' + html);
  var comp = document.getElementById('completion');
  var c = '<div class="win"><h2>' + (masteredNow ? '★ Mastered — ' : '✅ ') + esc(f.name) + ' — Level ' + level + ' complete</h2><p>' + esc(f.summary) + '</p>';
  if(cur.reveals.size > 0 && level === top) c += '<p class="small">You revealed ' + cur.reveals.size + ' piece(s), so this file is not mastered yet — replay Level ' + top + ' with no reveals to master it.</p>';
  if(f.modules.length){
    c += '<h3 style="margin:12px 0 6px;font-size:14px;color:var(--accent2)">Modules in this file</h3>';
    f.modules.forEach(function(id){ c += moduleCard(id); });
  }
  if(f.bash){
    var runDone = lp.levels[level] && lp.levels[level].run;
    c += '<div class="bashbox"><div class="prompt">student@controller:~/ansible$ <span style="color:var(--dim)">— type the command that runs or uses this file</span></div>' +
      '<input id="bashinput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the command...">' +
      '<div class="bigbtnrow"><button data-act="checkbash" class="primary small">Run it</button></div><div id="bashmsg" class="small">' + (runDone ? '✓ Done previously.' : '') + '</div></div>';
  }
  c += '<div class="bigbtnrow">';
  if(level < top) c += '<button class="primary" data-act="level" data-l="' + (level + 1) + '">Next: Level ' + (level + 1) + ' →</button>';
  c += '<button data-act="open" data-id="' + f.id + '">Back to this file</button><button data-act="home">All files</button><button data-act="shuffle">🔀 Shuffle</button></div></div>';
  comp.innerHTML = c;
  comp.scrollIntoView({behavior:'smooth', block:'start'});
}
function doCheckBash(){
  var input = document.getElementById('bashinput'), msg = document.getElementById('bashmsg');
  if(!input) return;
  var ok = gradeBash(cur.file, input.value);
  input.classList.remove('ok','bad');
  if(ok){
    input.classList.add('ok');
    var lp = fprog(cur.file);
    if(lp.levels[cur.level]){ lp.levels[cur.level].run = true; saveP(); }
    msg.innerHTML = '✓ Correct. ' + esc(cur.file.bash.explain);
  } else {
    input.classList.add('bad');
    msg.textContent = '✗ Not the command for this file — think about what runs or consumes it, then try again.';
  }
}

// ---------- global events ----------
document.body.addEventListener('click', function(ev){
  var tok = ev.target.closest ? ev.target.closest('[data-tok]') : null;
  if(tok && cur && cur.mode === 'study'){
    var ti = Number(tok.getAttribute('data-tok'));
    var b = fileBlanks(cur.file)[ti];
    var box = document.getElementById('explainbox');
    if(box && b) box.innerHTML = '<span class="piece">' + esc(b.b).replace(/\n/g, '<br>') + '</span><br>' + esc(b.e) + '<br><span class="small">\u2193 Its full definition is highlighted in the breakdown below.</span>';
    jumpToGloss(curLines[ti], true);
    return;
  }
  var rowEl = ev.target.closest ? ev.target.closest('[data-line]') : null;
  if(rowEl && cur && cur.mode === 'study'){
    var lnNo = Number(rowEl.getAttribute('data-line'));
    if(curGlossMap[lnNo]){ jumpToGloss(lnNo, false); return; }
  }
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.getAttribute('data-act');
  if(act === 'home') renderHome();
  else if(act === 'cards') renderCards();
  else if(act === 'reset'){ if(confirm('Reset all Playbook Learner progress?')){ P = {}; saveP(); renderHome(); } }
  else if(act === 'shuffle'){
    var f = FILES[Math.floor(Math.random() * FILES.length)];
    startSession(f, 'play', 1 + Math.floor(Math.random() * fileTop(f)));
  }
  else if(act === 'open'){ var f2 = fileById(el.getAttribute('data-id')); if(f2) startSession(f2, 'study', 1); }
  else if(act === 'study'){ if(cur) startSession(cur.file, 'study', 1); }
  else if(act === 'exam'){ if(cur) startSession(cur.file, 'exam', 1); }
  else if(act === 'level'){ if(cur) startSession(cur.file, 'play', Number(el.getAttribute('data-l'))); }
  else if(act === 'hint'){ doHint(Number(el.getAttribute('data-i'))); }
  else if(act === 'reveal'){ doReveal(Number(el.getAttribute('data-i'))); }
  else if(act === 'check'){ doCheck(); }
  else if(act === 'checkbash'){ doCheckBash(); }
});
document.body.addEventListener('input', function(ev){
  if(ev.target.classList && ev.target.classList.contains('blank') && cur){
    cur.values[ev.target.getAttribute('data-i')] = ev.target.value;
  }
});
document.body.addEventListener('keydown', function(ev){
  if(ev.target.tagName === 'TEXTAREA' && ev.target.classList.contains('blank') && ev.key === 'Tab'){
    ev.preventDefault();
    var ta = ev.target, st = ta.selectionStart, en = ta.selectionEnd, dir = ev.shiftKey ? -1 : 1;
    var ls = ta.value.lastIndexOf('\n', st - 1) + 1;
    var le = ta.value.indexOf('\n', en); if(le < 0) le = ta.value.length;
    if(en > ls && ta.value[en - 1] === '\n') le = en - 1;
    var segLines = ta.value.slice(ls, le).split('\n');
    var dFirst = 0, dTotal = 0;
    var out = segLines.map(function(ln2, ix){
      if(dir > 0){ dTotal += 2; if(ix === 0) dFirst = 2; return '  ' + ln2; }
      var mm = ln2.match(/^ {1,2}/); var rm = mm ? mm[0].length : 0;
      dTotal -= rm; if(ix === 0) dFirst = -rm; return ln2.slice(rm);
    }).join('\n');
    ta.setRangeText(out, ls, le, 'end');
    ta.selectionStart = Math.max(ls, st + dFirst);
    ta.selectionEnd = Math.max(ta.selectionStart, en + dTotal);
    if(st === en && dir > 0 && segLines.length === 1 && dFirst === 2 && ta.value.slice(ls, st + 2) === ta.value.slice(ls, ls) + '  ' + ta.value.slice(ls, st)){ /* single-caret Tab = one 2-space step, same result */ }
    if(cur) cur.values[ta.getAttribute('data-i')] = ta.value;
    updateVimPos(ta);
  }
  if(ev.target.tagName === 'TEXTAREA' && ev.target.classList.contains('blank') && ev.key === 'Enter'){
    ev.preventDefault();
    var tb = ev.target, cs = tb.selectionStart, ce = tb.selectionEnd;
    var lineStart = tb.value.lastIndexOf('\n', cs - 1) + 1;
    var curLine = tb.value.slice(lineStart, cs);
    var base = (curLine.match(/^ */) || [''])[0].length;
    var n = base, trimmed = curLine.replace(/\s+$/, '');
    var isItem = /^\s*-\s/.test(curLine), itemIsMap = /^\s*-\s+[^:\s]+:/.test(curLine);
    if(isItem && itemIsMap) n = base + 2 + (trimmed.endsWith(':') ? 2 : 0);
    else if(!isItem && trimmed.endsWith(':')) n = base + 2;
    tb.setRangeText('\n' + ' '.repeat(n), cs, ce, 'end');
    if(cur) cur.values[tb.getAttribute('data-i')] = tb.value;
    updateVimPos(tb);
  }
  if(ev.target.tagName === 'INPUT' && ev.target.classList && ev.target.classList.contains('blank') && ev.key === 'Enter'){
    ev.preventDefault(); doCheck();
  }
  if(ev.target.id === 'bashinput' && ev.key === 'Enter'){ ev.preventDefault(); doCheckBash(); }
});

function updateVimPos(el){
  if(!el || !el.classList || !el.classList.contains('blank')) return;
  var i = el.getAttribute('data-i');
  var rows = document.querySelectorAll('.ln.active');
  rows.forEach(function(r){ r.classList.remove('active'); });
  var row = el.closest ? el.closest('.ln') : null;
  if(row) row.classList.add('active');
  var pos = document.getElementById('vimpos'); if(!pos) return;
  var lineNo = curLines[i] || 1, col = (curCols[i] || 1) + (el.selectionStart || 0);
  if(el.tagName === 'TEXTAREA'){
    var upto = el.value.slice(0, el.selectionStart || 0);
    var nl = upto.split('\n').length - 1;
    lineNo = (curLines[i] || 1) + nl;
    col = (upto.length - (upto.lastIndexOf('\n') + 1)) + 1;
  }
  pos.textContent = 'Ln ' + lineNo + ', Col ' + col;
}
document.body.addEventListener('focusin', function(ev){ updateVimPos(ev.target); });
document.body.addEventListener('keyup', function(ev){ updateVimPos(ev.target); });
document.body.addEventListener('click', function(ev){ updateVimPos(ev.target); });

renderHome();
})();
