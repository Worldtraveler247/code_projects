<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playbook Learner — fill in the blanks, learn the playbook</title>
<meta name="description" content="A fill-in-the-blank learning game built from the real EX294 playbooks: keys first, then values, then the whole file from scratch — with the why behind every line.">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#30363d;
  --txt:#e6edf3; --dim:#9aa7b4; --accent:#3fb950; --accent2:#58a6ff;
  --warn:#d29922; --bad:#f85149; --gold:#e3b341;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#0a0e14;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header .logo{font-size:20px}
header h1{font-size:18px;margin:0;font-weight:700}
header h1 span{color:var(--accent)}
header .sub{color:var(--dim);font-size:12px;width:100%}
main{max-width:880px;margin:0 auto;padding:14px 12px 60px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:9px 14px;min-height:44px}
button:active{transform:translateY(1px)}
button.primary{background:#1f6f43;border-color:#2ea043;color:#fff;font-weight:600}
button.ghost{background:transparent}
button.small{min-height:36px;padding:5px 10px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.card h2{margin:0 0 8px;font-size:16px}
.card h3{margin:0 0 6px;font-size:14px;color:var(--accent2)}
.card p{margin:6px 0;line-height:1.5;font-size:14px}
.progressline{color:var(--dim);font-size:13px;margin:2px 0 12px}
.qgroup{margin:18px 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.filecard{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;width:100%;text-align:left}
.filecard .grow{flex:1;min-width:0}
.filecard .fname{font-family:var(--mono);font-size:14px;font-weight:700;word-break:break-all}
.filecard .fpath{font-family:var(--mono);font-size:11px;color:var(--dim);word-break:break-all}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--dim)}
.chip.done{color:#0d1117;background:var(--accent);border-color:var(--accent);font-weight:700}
.chip.mastered{color:#0d1117;background:var(--gold);border-color:var(--gold);font-weight:700}
.star{color:var(--gold);font-size:18px}
.spec{border-left:3px solid var(--accent2)}
.blueprint{border-left:3px solid var(--gold)}
.note{border-left:3px solid var(--warn);font-size:13px;color:var(--dim)}
.modebar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.modebar button.active{background:#1f6f43;border-color:#2ea043;color:#fff;font-weight:700}
.codebox{background:#0a0e14;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:6px 0;overflow-x:auto;margin:0}
.ln{display:flex;align-items:flex-start;min-height:22px;padding:0 10px 0 0;width:max-content;min-width:100%}
.ln:hover{background:rgba(88,166,255,.05)}
.ln:focus-within,.ln.active{background:rgba(227,179,65,.09);box-shadow:inset 2px 0 0 var(--gold)}
.ln .no{flex:0 0 38px;text-align:right;padding-right:10px;color:#484f58;font-family:var(--mono);font-size:12.5px;line-height:22px;user-select:none;border-right:1px solid #21262d;margin-right:10px}
.ln:focus-within .no,.ln.active .no{color:var(--gold);font-weight:700}
.ln .lc{flex:1;font-family:var(--mono);font-size:13.5px;line-height:22px;white-space:pre;color:#d6deeb;tab-size:2;background-image:repeating-linear-gradient(to right,rgba(255,255,255,.045) 0,rgba(255,255,255,.045) 1px,transparent 1px,transparent 2ch)}
.vimwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 12px;background:#0a0e14}
.vimbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#161b22;border-bottom:1px solid var(--line);padding:7px 10px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.vimbar .vfile{color:var(--txt);font-weight:700;word-break:break-all}
.tk-key{color:#79c0ff}.tk-colon{color:#ff7b72;font-weight:700}.tk-str{color:#e5c07b}.tk-jinja{color:#c792ea}.tk-num{color:#d19a66}.tk-bool{color:#56b6c2}.tk-com{color:#6a737d;font-style:italic}.tk-dash{color:#ff7b72}.tk-doc{color:#ff7b72}.tk-cmd{color:#61afef}.tk-mod{color:#c792ea}.tk-flag{color:#d19a66}.tk-kw{color:#c792ea}.tk-opt{color:#56b6c2}
.studyflow{border-left:3px solid var(--accent)}
.seccard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.seccard h3{margin:0 0 4px;font-size:14.5px;color:var(--txt)}
.seccard h3 .secno{color:var(--gold);font-family:var(--mono);font-size:12px;margin-right:6px}
.seccard .secwhy{font-size:13.5px;line-height:1.55;color:var(--dim);margin:4px 0 10px}
.seccode{background:#0a0e14;border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;margin:0 0 10px}
.seccode pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:20px;white-space:pre;color:#d6deeb;tab-size:2}
.gloss{margin:6px 0;padding:7px 9px;background:var(--panel2);border-radius:8px;font-size:13.5px;line-height:1.55;scroll-margin-top:96px;transition:background .3s,box-shadow .3s}
.gloss.flash{background:#2a230a;box-shadow:0 0 0 2px var(--gold)}
.qtext{font-size:14px;line-height:1.65;white-space:normal}
.tactics ol,.traps ul{margin:6px 0 2px;padding-left:20px}
.tactics li,.traps li{margin:5px 0;line-height:1.5;font-size:13.5px}
.drow{margin:8px 0;padding:9px 11px;background:var(--panel2);border-radius:8px}
.dfrom{color:#9ecbff;font-size:13.5px;line-height:1.5}
.darrow{color:var(--dim);font-size:11px;margin:3px 0}
.dto code{font-family:var(--mono);font-size:12.5px;color:#ffd75f;white-space:pre-wrap;word-break:break-word}
.dnote{font-size:13px;line-height:1.5;margin-top:4px}
.ln[data-line]{cursor:pointer}
.explainbox{scroll-margin-top:96px}
.gloss .gln{color:#484f58;font-family:var(--mono);font-size:11px;margin-right:6px}
.gloss code{font-family:var(--mono);font-size:12.5px;color:#ffd75f;word-break:break-all}
.flowsteps{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.6}
.vimrc-line{font-family:var(--mono);font-size:12.5px;background:#0a0e14;border:1px solid var(--line);border-radius:8px;padding:9px 10px;overflow-x:auto;white-space:pre;color:#e5c07b;margin:8px 0}
input.blank,textarea.blank{font-family:var(--mono);font-size:13.5px;background:#221d08;border:1px dashed var(--warn);color:#ffd75f;border-radius:5px;padding:1px 5px;outline:none;max-width:88vw}
textarea.blank{display:block;width:100%;margin:4px 0;line-height:22px;padding:6px 8px;resize:vertical;tab-size:2;background-image:repeating-linear-gradient(to right,rgba(255,255,255,.045) 0,rgba(255,255,255,.045) 1px,transparent 1px,transparent 2ch)}
input.blank:focus,textarea.blank:focus{border-color:var(--accent2);background:#101a2a}
input.blank.ok,textarea.blank.ok{border:1px solid var(--accent);background:#0f2416;color:#7ee787}
input.blank.bad,textarea.blank.bad{border:1px solid var(--bad);background:#2a1215;color:#ffa198}
input.blank.revealed,textarea.blank.revealed{border:1px solid #6e5494;background:#1d1529;color:#d2a8ff}
.bbtns{display:inline-flex;gap:2px;margin-left:3px;vertical-align:middle}
.bbtns button{min-height:26px;min-width:30px;padding:1px 5px;font-size:12px;border-radius:6px;background:transparent}
.blkbtns{display:flex;gap:6px;margin:2px 0 6px}
.tok{color:#ffd75f;border-bottom:1px dotted var(--warn);cursor:pointer;padding:0 1px}
.tok:active{background:#2a230a}
.feedback{display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.feedback.show{display:block}
.feedback .item{font-size:13.5px;line-height:1.5;margin:7px 0}
.feedback .item b{color:var(--accent2)}
.feedback .wrong b{color:var(--bad)}
.feedback .hintline b{color:var(--warn)}
.explainbox{display:none;background:#101a2a;border:1px solid #1f3a5f;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.55}
.explainbox.show{display:block}
.explainbox .piece{font-family:var(--mono);color:#ffd75f;font-size:13px;word-break:break-all}
.modcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:0 0 10px}
.modcard .mname{font-family:var(--mono);font-weight:700;color:#7ee787;font-size:13.5px;word-break:break-all}
.modcard p{font-size:13px;margin:5px 0;line-height:1.5}
.modcard .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.bashbox{background:#0a0e14;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.bashbox .prompt{font-family:var(--mono);color:var(--accent);font-size:13px}
.bashbox input{width:100%;margin-top:8px;background:#161b22;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:10px;font-family:var(--mono);font-size:14px}
.bashbox input.ok{border-color:var(--accent)}
.bashbox input.bad{border-color:var(--bad)}
.bigbtnrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.levelhead{font-size:15px;font-weight:700;margin:4px 0 8px}
.levelhead .lvtag{color:var(--warn)}
.small{font-size:12.5px;color:var(--dim)}
a{color:var(--accent2)}
.win{border:1px solid var(--accent);background:#0f2416;border-radius:12px;padding:14px;margin:0 0 14px}
.win h2{margin:0 0 6px;color:#7ee787;font-size:17px}

</style>
</head>
<body>
<header>
  <div class="logo">🧩</div>
  <h1>Playbook <span>Learner</span></h1>
  <div style="flex:1"></div>
  <button data-act="home" class="small">Files</button>
  <button data-act="cards" class="small">Module Cards</button>
  <button data-act="shuffle" class="small">🔀 Shuffle</button>
  <div class="sub">Fill in the missing pieces of the real EX294 playbooks — Level 1 keys, Level 2 values, Level 3 from scratch — and learn why every line sits where it sits.</div>
</header>
<main id="app"></main>
<script>
// ===DATA-START===
const FILES = [{"id":"q0-vimrc","q":0,"step":"Q0","name":".vimrc","path":"/home/student/.vimrc","lang":"vim","spec":"Set up ~/.vimrc before any playbook work: add the single autocmd line for the yaml filetype so vim applies buffer-local YAML settings when a YAML file is opened - 2-space indents made of spaces, autoindent, line numbers, and the cursor line and column lit.","blueprint":"One line: an autocmd for the yaml filetype that runs setlocal (buffer-local only) with ts=2, sts=2, sw=2, ai, cuc, cul, nu and expandtab.","summary":"You set up ~/.vimrc so every YAML file opened in vim is edited with 2-space space-only indents, autoindent, line numbers, and a lit cursor line and column - the editor setup every later question assumes.","modules":[],"segs":["autocmd FileType yaml setlocal ts=2 sts=2 sw=2 ai cuc cul nu expandtab\n"]},{"id":"q1-navigator","q":1,"step":"Q1","name":"ansible-navigator.yml","path":"/home/student/ansible/ansible-navigator.yml","lang":"yaml","spec":"Create ansible-navigator.yml in the project root so playbooks run inside an execution environment: podman as the engine, the creator-ee image, pull policy missing with a --tls-verify=false pull argument, playbook artifacts off, and stdout mode.","blueprint":"Not a playbook — a config map. One top-level key (ansible-navigator) holds three blocks: execution-environment (engine, image, pull rules), playbook-artifact (run records on/off), and mode (how output is shown).","summary":"You configured ansible-navigator to run every playbook inside the pinned creator-ee container under podman, pulling the image only when it is missing and printing output in stdout mode.","modules":[],"bash":{"answer":"ansible-navigator run packages.yml","a":["ansible-navigator run packages.yml -m stdout"],"explain":"With this config in the project root, navigator runs the playbook inside the EE — stdout mode is already set, so output prints like classic ansible-playbook."},"segs":["---\n",{"b":"ansible-navigator","l":2,"e":"The single top-level key. ansible-navigator reads only what lives under this key — anything outside it is ignored.","h":"The tool's own name, with a dash."},":\n  ",{"b":"execution-environment","l":2,"e":"The block that describes the container the playbook runs inside: engine, image, and how the image is pulled.","h":"The section about the environment the play executes in."},":\n    ",{"b":"enabled","l":2,"e":"The on/off key for the execution environment. Until this is true, the image below is just a wish.","h":"The switch key."},": ",{"b":"true","l":1,"e":"EE on. With it, every run happens inside the container — the same ansible-core and collections on any machine. Without it, navigator falls back to whatever Python happens to be installed on the host.","h":"Boolean on.","a":["yes","True"]},"\n    container-engine: ",{"b":"podman","l":1,"e":"The container engine that runs the execution environment on this controller — podman, the daemonless RHEL engine, not docker.","h":"RHEL's container engine."},"\n    image: ",{"b":"ghcr.io/ansible/creator-ee:v0.22.0","l":1,"e":"The exact EE image, pinned to a version tag. Pinning means every run uses the identical environment — no \"works on my controller\" drift.","h":"Starts with ghcr.io/ansible/ and ends with a version tag."},"\n    ",{"b":"pull:\n      policy: missing\n      arguments:\n        - \"--tls-verify=false\"","l":3,"m":true,"e":"The pull block controls how the image is fetched: policy missing downloads it only when it is not already cached locally, and the --tls-verify=false argument relaxes TLS checking for that pull — the lab registry path is not fully trusted.","h":"Three parts: a pull: block, policy: missing, and one argument that starts with --tls-verify.","a":["pull:\n      policy: missing\n      arguments:\n        - --tls-verify=false"]},"\n  ",{"b":"playbook-artifact","l":2,"e":"The block that controls the per-run JSON artifact navigator can save after each run.","h":"playbook-something."},":\n    enable: ",{"b":"false","l":1,"e":"Artifact saving off — runs stay output-only, no JSON record files piling up.","h":"Boolean off.","a":["no","False"]},"\n  ",{"b":"mode","l":2,"e":"The key that chooses how run output is presented.","h":"The display key."},": ",{"b":"stdout","l":1,"e":"stdout mode prints playbook output straight to the terminal, like classic ansible-playbook, instead of opening navigator's interactive TUI browser.","h":"The classic terminal output mode — std___."},"\n"]},{"id":"q2-repo-key","q":2,"step":"Q2","name":"repo_key.sh","path":"/home/student/ansible/repo_key.sh","lang":"bash","spec":"Write repo_key.sh holding three ad hoc commands: import the Dag GPG key on all hosts, then define the BaseOS and AppStream yum repositories (GPG check on, same key, enabled) pointing at the lab server 10.1.14.36.","blueprint":"A shell script of ad hoc commands — no playbook. Every line has the same skeleton: ansible <pattern> -m <module> -a \"<args>\" -b. Order is logic: the key is imported first, then the repos that trust it.","summary":"You imported the GPG key and defined both RHEL repos ad hoc. The key import must come first, because both repos verify package signatures against that key.","modules":["rpm_key","yum_repository"],"bash":{"answer":"bash repo_key.sh","a":["sh repo_key.sh","./repo_key.sh"],"explain":"Running the script fires the three ad hoc commands in order — key first, then the two repos."},"segs":["ansible ",{"b":"all","l":2,"e":"The host pattern: every managed host gets the key and both repos.","h":"The pattern meaning every host."}," -m ",{"b":"ansible.builtin.rpm_key","l":2,"e":"rpm_key imports a GPG public key into the RPM keyring. It must run before the repos below, because they check package signatures against this key.","h":"The module that imports an RPM GPG key.","a":["rpm_key"]}," -a \"key='",{"b":"http://apt.sw.be/RPM-GPG-KEY.dag.txt","l":1,"e":"The URL of the Dag GPG key. Both repos below name this exact URL as their gpgkey — the import and the references must match character for character.","h":"Ends in RPM-GPG-KEY.dag.txt."},"' state=present\" -b\nansible all -m ",{"b":"ansible.builtin.yum_repository","l":2,"e":"yum_repository writes a repo definition into /etc/yum.repos.d/ on each host — name, description, baseurl, and the GPG policy all live in this one call.","h":"The module that defines a yum repo.","a":["yum_repository"]}," -a \"name='BaseOS' description='",{"b":"BaseOS Repo","l":1,"e":"The human-readable description dnf shows for the BaseOS repo.","h":"Two words: BaseOS + Repo."},"' baseurl='",{"b":"http://10.1.14.36/RHEL9/BaseOS","l":1,"e":"Where the BaseOS packages actually live on the lab server. BaseOS is the core operating-system content stream.","h":"Host 10.1.14.36, path /RHEL9/BaseOS."},"' gpgcheck=true gpgkey='",{"b":"http://apt.sw.be/RPM-GPG-KEY.dag.txt","l":1,"e":"Same key URL imported in line 1 — with gpgcheck=true, every package signature is verified against this key.","h":"Identical to the key imported in line 1."},"' enabled=true\" -b\n",{"b":"ansible all -m ansible.builtin.yum_repository -a \"name='AppStream' description='AppStream Repo' baseurl='http://10.1.14.36/RHEL9/AppStream' gpgcheck=true gpgkey='http://apt.sw.be/RPM-GPG-KEY.dag.txt' enabled=true\" -b","l":3,"m":true,"e":"The whole AppStream command mirrors the BaseOS one — only the name, description, and baseurl path change. AppStream carries the application and user-space content stream that complements BaseOS.","h":"Copy the BaseOS line's shape; change BaseOS to AppStream in exactly three places."},"\n"]},{"id":"q3-packages","q":3,"step":"Q3","name":"packages.yml","path":"/home/student/ansible/packages.yml","lang":"yaml","spec":"Create packages.yml: install php and mariadb on the dev, test, and prod hosts; install the RPM Development Tools package group on dev; and update all packages to the latest version on dev.","blueprint":"One play: a header (hosts, become) plus tasks. Every task has the same anatomy — name, one module with its arguments, and an optional when that gates it by group membership.","summary":"You built a three-task package play: conditional installs with dnf, a package group via the @ prefix, and a full latest update — each task gated by group membership.","modules":["dnf"],"bash":{"answer":"ansible-playbook packages.yml","a":["ansible-playbook packages.yml --syntax-check"],"explain":"ansible-playbook runs the play; add --syntax-check first if you only want Ansible to parse it without touching a host."},"segs":["---\n- name: Install packages\n  hosts: ",{"b":"all","l":1,"e":"The play targets every managed host; the when conditions on the tasks do the narrowing to dev, test, and prod.","h":"Every host."},"\n  ",{"b":"become","l":2,"e":"become: true escalates privileges to root for the whole play — package work is impossible without it.","h":"The privilege-escalation key."},": ",{"b":"true","l":1,"e":"Escalation on. Install, group-install, and update all write to the system package database.","h":"Boolean on.","a":["yes","True"]},"\n  tasks:\n    - name: Install php and mariadb\n      ",{"b":"ansible.builtin.dnf","l":2,"e":"dnf is the package-manager module: it installs, removes, and updates RPM packages and package groups. All three tasks in this play use it — only the name and state change.","h":"The RPM package module (the FQCN of dnf).","a":["dnf"]},":\n        name:\n          - ",{"b":"php","l":1,"e":"php — one of the two packages destined for dev, test, and prod hosts.","h":"The web scripting language package."},"\n          - ",{"b":"mariadb","l":1,"e":"mariadb — the database server package paired with php on the same hosts.","h":"The open-source MySQL fork."},"\n        state: ",{"b":"present","l":1,"e":"present means \"installed, any version is fine\". Contrast it with the third task's latest — that difference is the whole point of having two states in one play.","h":"Installed; version does not matter."},"\n      when: ",{"b":"inventory_hostname in groups['dev'] or inventory_hostname in groups['test'] or inventory_hostname in groups['prod']","l":3,"m":true,"e":"One when with three or-cases: the task runs when this host belongs to dev OR test OR prod. Each case tests group membership through the groups magic variable.","h":"Three membership checks joined by or — dev, test, prod."},"\n    - name: Install the RPM Development Tools group\n      ansible.builtin.dnf:\n        name: ",{"b":"'@RPM Development Tools'","l":1,"e":"The @ prefix tells dnf this is a package GROUP, not a single package name. It is quoted because the name contains spaces.","h":"Starts with @ — it is a group, not a package.","a":["@RPM Development Tools"],"w":"Without the @, dnf hunts for one package literally named \"RPM Development Tools\" and finds nothing — @ is what makes it a group."},"\n        ",{"b":"state","l":2,"e":"state is dnf's verb: what should be true of the name above when the task finishes.","h":"The key paired with present/latest."},": present\n      when: inventory_hostname in groups['dev']\n    - name: Update all packages on dev\n      ansible.builtin.dnf:\n        name: ",{"b":"'*'","l":1,"e":"'*' means every installed package — combined with state: latest it becomes a full system update. It stays quoted so neither YAML nor a shell ever expands it.","h":"The wildcard, quoted.","a":["*","\"*\""]},"\n        state: ",{"b":"latest","l":1,"e":"latest upgrades to the newest available versions — the deliberate contrast with task 1's present.","h":"Newest versions, not just installed."},"\n      when: inventory_hostname in groups['dev']\n"]},{"id":"q4-collections-req","q":4,"step":"Q4.1","name":"collections/requirements.yml","path":"/home/student/ansible/collections/requirements.yml","lang":"yaml","spec":"Create collections/requirements.yml listing the three collections Ansible Galaxy should install: community.general, ansible.posix, and ansible.netcommon.","blueprint":"A tiny file with one idea: a top-level collections: list, each entry the name: of a Galaxy collection. ansible-galaxy reads this file instead of taking names on the command line.","summary":"You listed the three collections the rest of the exam quietly depends on — community.general supplies Q9's LVM modules and ansible.posix supplies the firewalld module used in Q7 and Q8.","modules":[],"bash":{"answer":"ansible-galaxy collection install -r collections/requirements.yml -p collections","a":["ansible-galaxy collection install -r collections/requirements.yml"],"explain":"-r points at the requirements file; -p collections installs into the local collections directory instead of your home directory."},"segs":["---\n",{"b":"collections","l":2,"e":"The top-level key ansible-galaxy looks for: the list of collections to download and install.","h":"The list's name — what Galaxy installs."},":\n  - name: ",{"b":"community.general","l":1,"e":"community.general carries the community modules — lvol and filesystem among them. Q9's playbook cannot even parse without this collection installed.","h":"The big community collection Q9 depends on."},"\n  - name: ",{"b":"ansible.posix","l":1,"e":"ansible.posix provides the firewalld module used by the apache role (Q7) and roles.yml (Q8).","h":"The collection that owns firewalld."},"\n  - ",{"b":"name: ansible.netcommon","l":3,"e":"The third required collection — ansible.netcommon holds the network automation content. Same list-entry shape as the two above.","h":"name: plus the network collection."},"\n"]},{"id":"q5-timesync","q":5,"step":"Q5.2","name":"timesync.yml","path":"/home/student/ansible/timesync.yml","lang":"yaml","spec":"Create timesync.yml: a play on all hosts that applies the RHEL timesync system role, configured with the time server 2.north-america.pool.ntp.org and iburst enabled.","blueprint":"A play with vars and roles — and NO tasks section at all. The vars are the role's inputs; the role's own internal tasks do the work. Configuration goes in, configuration comes out.","summary":"You configured time synchronization declaratively: one system role, fed by one variable holding a hostname plus the iburst flag.","modules":[],"bash":{"answer":"ansible-playbook timesync.yml","a":["ansible-playbook timesync.yml --syntax-check"],"explain":"The play runs the role on all hosts; the role rewrites the chrony configuration from your vars."},"segs":["---\n- name: Configure time synchronization\n  hosts: all\n  become: true\n  ",{"b":"vars","l":2,"e":"vars: is where you feed a role its inputs. The timesync role takes all of its instructions from variables — there are no tasks for you to write.","h":"The play section that holds role inputs."},":\n    ",{"b":"timesync_ntp_servers","l":2,"e":"The role's documented input variable: a list of NTP servers. The role — not you — turns this list into chrony configuration on each host.","h":"Starts with the role's name: timesync_..."},":\n      - hostname: ",{"b":"2.north-america.pool.ntp.org","l":1,"e":"The NTP pool hostname the role configures as the time source.","h":"A pool.ntp.org hostname."},"\n        iburst: ",{"b":"true","l":1,"e":"iburst makes the NTP client send a quick burst of queries at startup, so the clock locks onto the server fast instead of drifting in slowly.","h":"Boolean on — fast initial sync.","a":["yes","True"]},"\n",{"b":"  roles:\n    - redhat.rhel_system_roles.timesync","l":3,"m":true,"e":"The roles: section names the system role that does the work, by its full redhat.rhel_system_roles path. Roles listed here run before any tasks: would — and this play needs no tasks at all, because the role IS the work and the vars above are its only instructions.","h":"roles: plus the full redhat.rhel_system_roles.timesync name."},"\n"]},{"id":"q6-roles-req","q":6,"step":"Q6.1","name":"roles/requirements.yml","path":"/home/student/ansible/roles/requirements.yml","lang":"yaml","spec":"Create roles/requirements.yml so Galaxy installs geerlingguy.haproxy under the local name balancer and geerlingguy.php under the local name phpinfo.","blueprint":"A list of role entries. Each entry pairs src: (where Galaxy fetches it from) with name: (what it will be called on this machine after install).","summary":"You pinned the two Galaxy roles Q8 orchestrates — and renamed both, because the playbook will call them balancer and phpinfo, not by their Galaxy names.","modules":[],"bash":{"answer":"ansible-galaxy role install -r roles/requirements.yml -p roles","a":["ansible-galaxy role install -r roles/requirements.yml"],"explain":"-r reads the requirements file; -p roles installs into the local roles directory where playbooks look for them."},"segs":["---\n- ",{"b":"src","l":2,"e":"src: names where Galaxy downloads the role from — its address on Ansible Galaxy.","h":"The source key."},": ",{"b":"geerlingguy.haproxy","l":1,"e":"The Galaxy address of the HAProxy role. After install it will not be called this — see the name: below.","h":"geerlingguy. plus the proxy's name."},"\n  ",{"b":"name","l":2,"e":"name: is the local rename. Everything on this machine — including Q8's roles.yml — will reference the role by this name.","h":"The rename key."},": ",{"b":"balancer","l":1,"e":"The local name: after install, the role is referenced as balancer. roles.yml in Q8 calls it by exactly this name — a mismatch here breaks Q8.","h":"What Q8 calls this role."},"\n- ",{"b":"src: geerlingguy.php\n  name: phpinfo","l":3,"m":true,"e":"The second entry repeats the pattern end to end: Galaxy source geerlingguy.php, installed under the local name phpinfo — again, the exact name Q8's roles.yml uses.","h":"src geerlingguy.php, name phpinfo."},"\n"]},{"id":"q7-apache-tasks","q":7,"step":"Q7.3","name":"roles/apache/tasks/main.yml","path":"/home/student/ansible/roles/apache/tasks/main.yml","lang":"yaml","spec":"Write the apache role's task file: install httpd and firewalld; start and enable both services; open http and https in the firewall, both immediately and permanently; then deploy the index template with the SELinux type Apache can read.","blueprint":"A role's tasks/main.yml is a bare task list — no play header, no hosts line. Four tasks in strict dependency order: packages, then services, then firewall, then content. Each task exists because a later one needs it.","summary":"You built the apache role's engine room: the firewall module needs the daemon task 1 installs and task 2 starts, and the template only serves once its SELinux type is right.","modules":["dnf","service","firewalld","template"],"bash":{"answer":"ansible-playbook role.yml","a":["ansible-playbook role.yml --syntax-check"],"explain":"role.yml (Q7) is the playbook that includes this role — a role's task file never runs by itself."},"segs":["---\n- name: Install httpd and firewalld\n  ",{"b":"ansible.builtin.dnf","l":2,"e":"dnf installs the packages. Read the list carefully: it includes firewalld itself, because the firewalld module later in this file can only manage a daemon that exists.","h":"The package module, in FQCN form.","a":["dnf"]},":\n    name:\n      - ",{"b":"httpd","l":1,"e":"httpd — the Apache web server package the question names.","h":"The Apache package."},"\n      - ",{"b":"firewalld","l":1,"e":"firewalld — never named in the question, but required: the ansible.posix.firewalld module talks to this running daemon over D-Bus. Red Hat states outcomes; supplying the prerequisites is your job.","h":"The daemon the firewall module needs.","w":"Leaving firewalld off this list is the classic trap of this question: the spec names only httpd, but the firewall task later fails because there is no daemon to talk to."},"\n    state: ",{"b":"present","l":1,"e":"present = installed. Version does not matter here.","h":"Installed."},"\n- name: Start and enable httpd and firewalld\n  ",{"b":"ansible.builtin.service","l":2,"e":"service manages daemons: state started means running now, enabled means starts at boot. Its name: takes ONE service per task — which is exactly why this task needs the loop below.","h":"The daemon manager module.","a":["service"]},":\n    name: \"{{ item }}\"\n    state: ",{"b":"started","l":1,"e":"started = running right now, as opposed to enabled, which is about the next boot.","h":"Running now."},"\n    enabled: ",{"b":"true","l":1,"e":"enabled: true makes both services start at boot — running now AND surviving a reboot. started without enabled is a service that dies at the first restart.","h":"Boolean on — start at boot.","a":["yes","True"]},"\n  loop:\n    - httpd\n    - firewalld\n- name: Permit http and https in the firewall\n  ",{"b":"ansible.posix.firewalld","l":2,"e":"firewalld (from the ansible.posix collection installed in Q4) manages firewall rules by service name. It talks to the firewalld daemon — the same daemon task 1 installed and task 2 started. This task is why both of those exist.","h":"The firewall module from ansible.posix.","a":["firewalld"]},":\n    service: \"{{ item }}\"\n    state: enabled\n    ",{"b":"immediate: true\n    permanent: true","l":3,"m":true,"e":"Both switches, always together: immediate applies the rule to the running firewall right now; permanent writes it into the stored configuration so it survives a reboot. Either one alone leaves the rule half-set — working until reboot, or only after one.","h":"Two booleans: one for right now, one for after reboot."},"\n  loop:\n    - ",{"b":"http","l":1,"e":"http — a firewalld service name, which is a port bundle: 80/tcp.","h":"Port 80's service name."},"\n    - ",{"b":"https","l":1,"e":"https — the 443/tcp bundle. The question's \"allow access to the web server\" means both services open.","h":"Port 443's service name.","w":"Opening only http leaves https blocked — the loop needs both names."},"\n- name: Deploy the index page\n  ansible.builtin.template:\n    src: index.html.j2\n    dest: ",{"b":"/var/www/html/index.html","l":1,"e":"The rendered template lands at Apache's document root as index.html — the file httpd serves by default.","h":"Apache's document root plus index.html."},"\n    ",{"b":"setype","l":2,"e":"setype sets the SELinux type on the delivered file — the parameter that decides whether Apache is even allowed to read it.","h":"The SELinux type key (se...)."},": ",{"b":"httpd_sys_content_t","l":1,"e":"httpd_sys_content_t is the SELinux type Apache content must carry. Without it the file, service, and firewall can all be perfect and the page still serves 403 Forbidden.","h":"The type Apache content must carry: httpd_sys_...","w":"Wrong or missing SELinux type means 403 Forbidden even with the service running, the firewall open, and the file in place."},"\n"]},{"id":"q7-apache-template","q":7,"step":"Q7.4","name":"roles/apache/templates/index.html.j2","path":"/home/student/ansible/roles/apache/templates/index.html.j2","lang":"jinja","spec":"Create the apache role's template: a single greeting line that prints the host's own fully qualified domain name and its default IPv4 address, both taken from facts.","blueprint":"A Jinja2 template is plain text with {{ }} expressions. Ansible fills each expression from the facts of the host being configured, at deploy time — so one file produces a different, correct page on every server.","summary":"One line, two facts: fqdn supplies the name and default_ipv4.address supplies the reachable IP — every web server ends up serving a page that names itself.","modules":["template","facts"],"bash":{"answer":"ansible-playbook role.yml","a":["ansible-playbook role.yml --syntax-check"],"explain":"Deploying the role runs the template task, which renders this file onto each web server."},"top":2,"segs":["Welcome to ",{"b":"{{ ansible_facts['fqdn'] }}","l":1,"e":"The fqdn fact — this host's fully qualified domain name. Facts are gathered per host, so servera's page names servera and serverb's names serverb, from the same template.","h":"ansible_facts plus the fully-qualified-name fact.","a":["{{ ansible_facts[\"fqdn\"] }}"]}," and the IP Address is ",{"b":"{{ ansible_facts['default_ipv4']['address'] }}","l":2,"e":"default_ipv4 is a nested fact: the interface that carries the default route — the reachable address. The ['address'] key digs one level into that dictionary to get the number itself.","h":"A nested fact — default IPv4, then its address key.","a":["{{ ansible_facts[\"default_ipv4\"][\"address\"] }}"]},"\n"]},{"id":"q7-role-yml","q":7,"step":"Q7.5","name":"role.yml","path":"/home/student/ansible/role.yml","lang":"yaml","spec":"Create role.yml: one play on the webservers group that applies the apache role through an include_role task.","blueprint":"A minimal play: a header (hosts, become) plus a single task whose module is include_role. The role is the payload; this file is just the trigger.","summary":"You wired the trigger: this play is how the apache role built in the role's task and template files gets executed against the webservers group.","modules":["include_role"],"bash":{"answer":"ansible-playbook role.yml","a":["ansible-playbook role.yml --syntax-check"],"explain":"This is the command Q7.6 runs — the playbook applies the role to every webservers host."},"segs":["---\n- name: Deploy the apache role\n  ",{"b":"hosts","l":2,"e":"hosts: chooses which inventory group this play runs on — the targeting decision of the whole play lives on this one key.","h":"The targeting key."},": ",{"b":"webservers","l":1,"e":"The webservers inventory group — the role lands only on these hosts.","h":"The web server group."},"\n  become: ",{"b":"true","l":1,"e":"Installing packages, starting services, and writing into /var/www all need root.","h":"Boolean on.","a":["yes","True"]},"\n",{"b":"  tasks:\n    - name: Include the apache role\n      ansible.builtin.include_role:\n        name: apache","l":3,"m":true,"e":"The play's only task uses include_role to run the apache role. include_role is dynamic — the role is loaded when the task executes — unlike the static roles: list used in Q5 and Q8. The name must match the role's directory: roles/apache.","h":"tasks: plus one include_role task naming apache."},"\n"]},{"id":"q8-roles","q":8,"step":"Q8.6","name":"roles.yml","path":"/home/student/ansible/roles.yml","lang":"yaml","spec":"Complete roles.yml: point haproxy_backend_servers at serverb (172.25.250.11) and serverc (172.25.250.12) on port 80, set the php package list, apply the balancer role only to the balancers group and phpinfo only to webservers, and open http on the balancer in post_tasks.","blueprint":"A dispatcher play, not a worker. It has hosts and roles but NO tasks section: play vars feed the roles, the roles: list IS the work, and post_tasks hold the steps that belong to no role. A play's sections always run in a fixed order — pre_tasks, roles, tasks, post_tasks.","summary":"You orchestrated two downloaded roles from one play — variables in at the top, a group guard on each role, and one self-guarded firewall task after them.","modules":["firewalld"],"bash":{"answer":"ansible-playbook roles.yml","a":["ansible-navigator run roles.yml -m stdout","ansible-playbook roles.yml --syntax-check"],"explain":"Running roles.yml fires the balancer role on serverd, the phpinfo role on the web servers, then the post_task opens the balancer's firewall."},"segs":["---\n- name: Including Roles\n  hosts: all\n  become: true\n  vars:\n    haproxy_backend_servers:\n      - name: ",{"b":"serverb.lab.example.com","l":1,"e":"Backend 1 of the load balancer: serverb's fully qualified name — the identity HAProxy health-checks and forwards traffic to.","h":"serverb's FQDN."},"\n        address: ",{"b":"172.25.250.11","l":1,"e":"serverb's address on the lab network — the test-environment value.","h":"Ends in .11."},"\n        port: ",{"b":"80","l":1,"e":"The backends serve plain HTTP on port 80.","h":"The HTTP port."},"\n      - name: ",{"b":"serverc.lab.example.com","l":1,"e":"Backend 2: serverc. HAProxy round-robins between this backend and serverb — hit the balancer repeatedly and the answers alternate.","h":"serverc's FQDN."},"\n        address: ",{"b":"172.25.250.12","l":1,"e":"serverc's address — one higher than serverb's, on the same subnet.","h":"Ends in .12."},"\n        port: 80\n    ",{"b":"php_packages","l":2,"e":"A play variable that OVERRIDES the phpinfo role's own default package list. Play vars outrank role defaults in variable precedence — that is why setting it here changes what the role installs.","h":"The variable the php role reads for its package list."},":\n      - php\n      - php-cli\n      - ",{"b":"php-common","l":1,"e":"php-common — the shared foundation package (common files, the /etc/php.d layout). php is the web face Apache executes through; php-cli is the terminal face. All three are required.","h":"The third php package — the common one."},"\n  ",{"b":"roles","l":2,"e":"The roles: section replaces the task list in this play — each entry is a pre-packaged bundle of tasks applied in order. The dispatcher does not do the work; it assigns it.","h":"The section that lists which roles run."},":\n    - role: ",{"b":"balancer","l":1,"e":"The balancer role — geerlingguy.haproxy under the local name Q6 gave it. It runs only on the balancers group, per the when attached below.","h":"The local name from Q6's requirements file."},"\n      when: ",{"b":"\"'balancers' in group_names\"","l":1,"e":"group_names lists the groups THIS host belongs to. Role entries carry their guard at the door like this because the play targets all hosts — without it, every host would try to become a load balancer.","h":"A group_names membership test for balancers.","a":["'balancers' in group_names"],"w":"Without the group_names guard, the balancer role would run on every host in the play, not just serverd."},"\n    - role: phpinfo\n      when: \"'webservers' in group_names\"\n  ",{"b":"post_tasks:\n    - name: Open http on balancer\n      ansible.posix.firewalld:\n        service: http\n        permanent: true\n        immediate: true\n        state: enabled\n      when: \"'balancers' in group_names\"","l":3,"m":true,"e":"post_tasks is a fixed play section for steps that must run last and belong to no role — here, play-level glue that opens the balancer's firewall. Notice only this task carries its own when: role entries wear theirs at the door, but a naked task in an all-hosts play must guard itself, or it would fire on the web servers too and fail where firewalld is not running.","h":"post_tasks: plus the firewalld task plus its balancers when."},"\n"]},{"id":"q9-lvm","q":9,"step":"Q9","name":"lvm.yml","path":"/home/student/ansible/lvm.yml","lang":"yaml","spec":"Create lvm.yml: if the yellowtail volume group is missing, the host must fail with the message \"Volume group does not exist\". Where it exists, create the logical volume data at 1500 MiB; if that fails, display \"Could not create logical volume at that size\" and create it at 800 MiB instead. Format it ext4. Do not mount it.","blueprint":"One play, three movements in order: a fail guard, a block/rescue pair (try the big size, fall back to the smaller one), and an unguarded format task. The order IS the logic — each part only works because of where it sits.","summary":"You built guarded storage automation: refuse cleanly where the VG is absent, try big, rescue smaller, then format. The designed outcomes — one host clean at 1500, one rescued at 800, one failed on purpose.","modules":["fail","lvol","filesystem","debug"],"bash":{"answer":"ansible-playbook lvm.yml","a":["ansible-navigator run lvm.yml -m stdout","ansible-playbook lvm.yml --syntax-check"],"explain":"Watch the per-host outcomes as it runs: ok, rescued=1, and failed=1 are all correct results for this playbook."},"segs":["---\n- name: Create a logical volume\n  hosts: all\n  become: ",{"b":"true","l":1,"e":"LVM work is root-only, and become sits at PLAY level here so every task — fail, lvol, filesystem — inherits it at once.","h":"Boolean on.","a":["yes","True"]},"\n  tasks:\n    ",{"b":"- name: Fail if volume group yellowtail does not exist\n      ansible.builtin.fail:\n        msg: \"Volume group does not exist\"\n      when: \"'yellowtail' not in ansible_facts['lvm']['vgs']\"","l":3,"m":true,"e":"The guard task, whole. ansible.builtin.fail is Ansible's abort mechanism: it fires only when the lvm facts say yellowtail is absent, stops that host with the exact graded message, and removes the host from the play — which is why block, rescue, and the format task below need no conditions of their own. The exam's \"must FAIL with this message\" is a behavior, and fail is how you program it.","h":"Three parts: the fail module, the exact message, and a \"not in\" when tested against the lvm vgs fact."},"\n    - name: Create logical volume with size\n      ",{"b":"block","l":2,"e":"block: groups tasks so a rescue: section can catch their failure — it is Ansible's try/catch. Anything inside that fails hands control to rescue instead of killing the play.","h":"The wrapper keyword that rescue pairs with."},":\n        - name: Create 1500 MiB logical volume\n          ",{"b":"community.general.lvol","l":2,"e":"lvol is the hand on lvcreate: it creates (or grows) a logical volume inside an EXISTING volume group. It never creates the VG itself — which is why the fail guard had to check for yellowtail first. It comes from community.general, the collection installed back in Q4.","h":"The LV module from community.general.","a":["lvol"]},":\n            vg: ",{"b":"yellowtail","l":1,"e":"vg names the pool the volume is carved from. Together with lv below it fixes the device path — and the VG is guaranteed to exist here because the guard task already removed hosts without it.","h":"The volume group's name."},"\n            lv: ",{"b":"data","l":1,"e":"lv is the volume's own name. vg + lv together are the address: /dev/yellowtail/data.","h":"The logical volume's name."},"\n            size: ",{"b":"1500m","l":1,"e":"The first, optimistic size: 1500 MiB requested against the VG's free space. On a host that cannot spare it, this task fails — and that failure is the designed trigger for the rescue below.","h":"The big size first: 1500 plus the m unit.","w":"1500m is a request, not a guarantee — if the VG lacks the free space the task fails, which is exactly what the rescue is for."},"\n            state: present\n      ",{"b":"rescue","l":2,"e":"rescue: runs only when something in the block above fails — and because it handles the failure, the host is marked rescued instead of failed and the play continues to the format task.","h":"The keyword that catches a block failure."},":\n        - name: Display size error message\n          ansible.builtin.debug:\n            msg: ",{"b":"\"Could not create logical volume at that size\"","l":1,"e":"The rescue's announcement — a required, exact message. The recovery in this playbook is NOT silent: the message prints first, then the smaller volume is built.","h":"The rescue message, word for word.","a":["Could not create logical volume at that size"]},"\n        - name: Create 800 MiB logical volume instead\n          community.general.lvol:\n            vg: yellowtail\n            lv: data\n            size: ",{"b":"800m","l":1,"e":"The fallback: the identical lvol call at 800 MiB — the size that fits the smaller VG. Same vg, same lv, only the number changes.","h":"The smaller size: 800 plus m."},"\n            state: present\n    - name: Format logical volume with ext4 filesystem\n      ",{"b":"community.general.filesystem","l":2,"e":"filesystem is the hand on mkfs: it writes a filesystem onto a device. Notice it carries NO when — every host that survived the guard and built its LV reaches this task, so it needs no condition of its own. Also from community.general (Q4).","h":"The mkfs module from community.general.","a":["filesystem"]},":\n        fstype: ",{"b":"ext4","l":1,"e":"ext4 — the filesystem recipe the question requires.","h":"The filesystem type."},"\n        dev: ",{"b":"/dev/yellowtail/data","l":1,"e":"dev is the address of the device to format: /dev/<vg>/<lv>. You read this value from lvdisplay's field literally named \"LV Path\" — never guess it, because a guessed path can format the wrong device.","h":"/dev/ plus vg plus / plus lv.","w":"A guessed device path risks formatting the wrong disk. The path is assembled from the two names above: /dev/yellowtail/data."},"\n"]},{"id":"q10-hosts-j2","q":10,"step":"Q10.1","name":"hosts.j2","path":"/home/student/ansible/hosts.j2","lang":"jinja","spec":"Complete hosts.j2: under the two given localhost lines, add a loop that walks every host in the inventory and prints one line per host — its default IPv4 address, its FQDN, and its short hostname, space-separated.","blueprint":"A template with two fixed lines and one Jinja loop. The loop builds the rows; the three expressions in each row fill the classic /etc/hosts columns in order: IP address (the lookup key), canonical name (the FQDN), alias (the short hostname).","summary":"You generated a hosts file out of facts: hostvars lets the template read EVERY host's facts while it renders, so the data scope (all hosts) is wider than the delivery scope (dev only, decided in hosts.yml).","modules":["facts"],"bash":{"answer":"ansible-playbook hosts.yml","a":["ansible-navigator run hosts.yml -m stdout"],"explain":"hosts.yml renders this template and delivers the result to /etc/myhosts on the dev hosts."},"segs":["127.0.0.1 localhost localhost.localdomain localhost4 localhost4.localdomain4\n::1 localhost localhost.localdomain localhost6 localhost6.localdomain6\n",{"b":"{% for x in","l":2,"e":"The loop opens. One output row will be produced per host the loop walks, in inventory order. The loop variable is x — every expression in the row refers back to it.","h":"A Jinja for tag with loop variable x."}," ",{"b":"groups['all']","l":1,"e":"groups['all'] is the list the loop walks: every host in the inventory. Data for all of them gets read here, even though hosts.yml later delivers the file to dev hosts only.","h":"The inventory-wide group.","a":["groups[\"all\"]"]}," %}\n",{"b":"{{ hostvars[x]['ansible_facts']['default_ipv4']['address'] }} {{ hostvars[x]['ansible_facts']['fqdn'] }} {{ hostvars[x]['ansible_facts']['hostname'] }}","l":3,"m":true,"e":"One row, three columns, in /etc/hosts grammar order: IP first (the key a lookup starts from), FQDN second (the host's one canonical name), short hostname last (an alias). All three values come from the SAME host in the same pass — hostvars[x] reaches into each host's gathered facts — so a row can never mix two hosts' data.","h":"Three hostvars[x] lookups in order: default_ipv4 address, fqdn, hostname."},"\n",{"b":"{% endfor %}","l":1,"e":"Every Jinja for must be closed. endfor ends the row loop — forget it and the template fails to render at all.","h":"The loop's closing tag."},"\n"]},{"id":"q10-hosts-yml","q":10,"step":"Q10.2","name":"hosts.yml","path":"/home/student/ansible/hosts.yml","lang":"yaml","spec":"Create hosts.yml: one play that runs on all hosts with privilege escalation, whose single task renders hosts.j2 to /etc/myhosts — but only on hosts in the dev group. No file permissions are specified.","blueprint":"One play, one task. The narrowing to dev lives on the TASK's when, not in the play header — so the play can target all hosts while the delivery stays narrow.","summary":"You paired the template with its playbook: hosts.j2 renders on the controller from every host's facts, and /etc/myhosts lands only where the task's when allows it.","modules":["template"],"bash":{"answer":"ansible-playbook hosts.yml","a":["ansible-navigator run hosts.yml -m stdout","ansible-playbook hosts.yml --syntax-check"],"explain":"One run renders the template once and delivers /etc/myhosts to the dev hosts only."},"segs":["---\n- name: Generate /etc/hosts using j2 file\n  hosts: ",{"b":"all","l":1,"e":"The play deliberately runs on all hosts. The dev-only narrowing happens on the task below — putting it here in the header would be a different (wrong) design for this question.","h":"Every host."},"\n  become: true\n  tasks:\n    - name: Create /etc/myhosts using j2 file\n      ",{"b":"ansible.builtin.template","l":2,"e":"template renders a Jinja2 file on the controller using the target host's facts, then delivers the rendered result. It is the module that pairs with hosts.j2 — copy would ship the raw {{ }} expressions unrendered.","h":"The rendering module (the FQCN of template).","a":["template"]},":\n        src: ",{"b":"hosts.j2","l":1,"e":"The template authored in the previous step. src is just a filename — Ansible searches the playbook directory and its templates/ folder for it.","h":"The template's filename."},"\n        dest: ",{"b":"/etc/myhosts","l":1,"e":"The rendered file lands at /etc/myhosts — NOT /etc/hosts. And no mode is set: the question specifies no permissions, so none get invented.","h":"/etc/ plus the file's name — myhosts."},"\n      ",{"b":"when: inventory_hostname in groups['dev']","l":3,"e":"Delivery scope: only dev hosts receive the file, even though the template's loop read every host's facts. Data scope is not delivery scope — this one line is what separates them.","h":"when plus a groups['dev'] membership test."},"\n"]},{"id":"q11-issues","q":11,"step":"Q11","name":"issues.yml","path":"/home/student/ansible/issues.yml","lang":"yaml","spec":"Create issues.yml: one play on all hosts with three copy tasks that set /etc/issue to Development on dev hosts, Test on test hosts, and Production on prod hosts — one task per group, in that order.","blueprint":"One play, three near-identical tasks. The pattern to internalize: same module, same destination — only the content and the when change from task to task. And because tasks run top to bottom, order decides what a host in two groups ends up with.","summary":"You stamped per-group login banners with copy plus when — and met the tie-breaker rule: on a host in several groups (prod is also in test), the last matching task in the file wins.","modules":["copy"],"bash":{"answer":"ansible-playbook issues.yml","a":["ansible-navigator run issues.yml -m stdout","ansible-playbook issues.yml --syntax-check"],"explain":"After the run, /etc/issue on each host shows its group's word — with prod's word winning wherever groups overlap."},"segs":["---\n- name: Modify File Content Based on Host Group\n  hosts: all\n  become: true\n  tasks:\n    - name: Modify issue.txt based on dev group\n      ",{"b":"ansible.builtin.copy","l":2,"e":"copy with a content: parameter writes literal text straight to a file — no source file needed. The same module performs all three tasks in this play; only content and when change.","h":"The file-writing module (FQCN of copy).","a":["copy"]},":\n        dest: ",{"b":"/etc/issue","l":1,"e":"/etc/issue — the pre-login banner file. All three tasks write this same path; each host keeps whichever matching task ran last.","h":"The banner file's path."},"\n        content: ",{"b":"Development","l":1,"e":"Dev hosts get the Development banner.","h":"The dev group's word."},"\n      when: inventory_hostname in groups['dev']\n    - name: Modify issue.txt based on test group\n      ansible.builtin.copy:\n        dest: /etc/issue\n        content: ",{"b":"Test","l":1,"e":"Test hosts get Test. Same task shape as dev — only the word and the group differ.","h":"The test group's word."},"\n      when: inventory_hostname in groups['test']\n    ",{"b":"- name: Modify issue.txt based on prod group\n      ansible.builtin.copy:\n        dest: /etc/issue\n        content: Production\n      when: inventory_hostname in groups['prod']","l":3,"m":true,"e":"The prod task repeats the shape a third time — and its position at the bottom is load-bearing. One host sits in both test and prod; tasks run in file order, so this task writes last and Production is what that host ends up displaying.","h":"Same copy task: content Production, when prod."},"\n"]},{"id":"q12-webcontent","q":12,"step":"Q12","name":"webcontent.yml","path":"/home/student/ansible/webcontent.yml","lang":"yaml","spec":"Create webcontent.yml for the dev hosts only: create the group devops; create the directory /webdev owned by that group with mode 2775; create /webdev/index.html containing Development; and symlink /var/www/html/webdev to /webdev with force.","blueprint":"One play on dev only, four tasks forming a dependency chain: group first, then the directory that group owns, then a file inside the directory, then a symlink that exposes it inside the web root. Nothing here needs a when — the play header already narrowed the targets.","summary":"You built a small dependency chain where each task consumes the previous task's output, and used the setgid mode so files created inside /webdev inherit the devops group automatically.","modules":["group","file","copy"],"bash":{"answer":"ansible-playbook webcontent.yml","a":["ansible-navigator run webcontent.yml -m stdout","ansible-playbook webcontent.yml --syntax-check"],"explain":"After the run, /webdev exists with group devops and mode 2775, holds index.html, and answers through the /var/www/html/webdev link."},"segs":["---\n- name: Create a webcontent file\n  hosts: ",{"b":"dev","l":1,"e":"This play narrows at the HEADER: only dev hosts, full stop. Unlike Q10 and Q11, no task below needs a when — the targeting decision was made once, up here.","h":"Just the dev group."},"\n  become: true\n  tasks:\n    - name: Create devops group\n      ",{"b":"ansible.builtin.group","l":2,"e":"group creates a Linux group. It runs FIRST for a reason: the directory task below names devops as its owning group, and a group must exist before anything can be owned by it. Order is a dependency, not a style.","h":"The group-management module (FQCN of group).","a":["group"]},":\n        name: ",{"b":"devops","l":1,"e":"The group name. Q15 reuses this exact group for its developer accounts — names are contracts across playbooks.","h":"The collaboration group's name."},"\n        state: present\n    - name: Create /webdev directory\n      ",{"b":"ansible.builtin.file","l":2,"e":"file is the filesystem swiss-army module: its state parameter picks WHAT it makes — directory in this task, link in the last one. Same module, different mode of operation.","h":"The filesystem module (FQCN of file).","a":["file"]},":\n        state: ",{"b":"directory","l":1,"e":"state: directory tells file to create a directory at path (and manage its ownership and mode).","h":"The state that makes a folder."},"\n        path: ",{"b":"/webdev","l":1,"e":"The directory itself, at the filesystem root.","h":"The directory's absolute path."},"\n        group: devops\n        mode: ",{"b":"\"2775\"","l":1,"e":"mode 2775 is rwxrwxr-x PLUS the setgid bit — the leading 2 — so any file created inside /webdev automatically inherits the devops group. It must be quoted: as a bare number, YAML hands Ansible an integer and the setgid meaning is lost.","h":"Four digits, quoted — the first one is setgid.","a":["'2775'"],"q":true,"w":"Unquoted 2775 gets read by YAML as a plain number and the leading setgid bit (the 2) is lost — quote it so it stays the string \"2775\"."},"\n    - name: Creating index.html file\n      ansible.builtin.copy:\n        dest: ",{"b":"/webdev/index.html","l":1,"e":"The content file inside the directory task 2 built — this dest only makes sense because /webdev already exists.","h":"Inside /webdev, named index.html."},"\n        content: Development\n    ",{"b":"- name: Create symbolic link\n      ansible.builtin.file:\n        state: link\n        src: /webdev/\n        path: /var/www/html/webdev\n        force: true","l":3,"m":true,"e":"The closing link task: state: link flips the file module into symlink mode; src /webdev/ (trailing slash — the directory itself) becomes reachable inside Apache's document root at path; and force: true replaces whatever already occupies that path instead of failing.","h":"file with state: link, src /webdev/, path inside /var/www/html, force: true."},"\n"]},{"id":"q13-hwreport","q":13,"step":"Q13","name":"hwreport.yml","path":"/home/student/ansible/hwreport.yml","lang":"yaml","spec":"Create hwreport.yml: download hwreport.empty from the exam server onto every host as /root/hwreport.txt (forced fresh), then fill in five labelled lines with facts — inventory host name, total memory in MB, BIOS version, and the sizes of disks sda and sdb, reading NONE for a disk that is absent.","blueprint":"One download plus five line edits. get_url fetches the labelled skeleton; then each lineinfile pairs a regexp (find the line by its label) with a line (the label plus a fact value). Same module five times — only the label and the fact change.","summary":"You turned a blank form into a per-host hardware report: one downloader, five surgical line replacements, and default('NONE') standing guard over missing hardware.","modules":["get_url","lineinfile","facts"],"bash":{"answer":"ansible-playbook hwreport.yml","a":["ansible-navigator run hwreport.yml -m stdout","ansible-playbook hwreport.yml --syntax-check"],"explain":"Every managed node ends up with its own completed /root/hwreport.txt — same labels, its own facts."},"segs":["---\n- name: Generate a Hardware Report\n  hosts: all\n  become: true\n  tasks:\n    - name: Download hwreport.empty\n      ",{"b":"ansible.builtin.get_url","l":2,"e":"get_url downloads a file from a URL onto the managed host — the report skeleton comes from the exam server onto every node. It is NOT uri: uri calls APIs and returns data to the controller; it never saves a file.","h":"The download module — get_...","a":["get_url"],"w":"uri is the classic trap in this question: it fetches API responses, it does not download a file to disk. The module that saves a file is get_url."},":\n        url: ",{"b":"http://10.1.10.121/hwreport.empty","l":1,"e":"The skeleton report on the exam server — a labelled form with empty values, waiting to be filled in.","h":"The exam server plus hwreport.empty."},"\n        dest: ",{"b":"/root/hwreport.txt","l":1,"e":"The downloaded skeleton lands here — and every lineinfile below edits THIS exact path. Download dest and edit path must agree, or the edits land in a file nobody downloaded.","h":"/root/ plus hwreport.txt."},"\n        force: ",{"b":"true","l":1,"e":"force: true re-downloads a fresh skeleton on every run, so yesterday's filled-in values never survive into today's report.","h":"Boolean on — always a fresh copy.","a":["yes","True"]},"\n    - name: Update inventory hostname\n      ",{"b":"ansible.builtin.lineinfile","l":2,"e":"lineinfile finds the line matching regexp: and replaces it with line:. All five remaining tasks are this one module — learn its pair of parameters once and the rest is repetition.","h":"The line-editing module (FQCN of lineinfile).","a":["lineinfile"]},":\n        path: /root/hwreport.txt\n        regexp: '^Inventory host name'\n        line: ",{"b":"\"Inventory host name={{ inventory_hostname }}\"","l":1,"e":"inventory_hostname is a magic variable — this host's name as the inventory knows it. The label half of the line must match the regexp's label, or the replacement reads wrong.","h":"Label plus the inventory_hostname variable.","a":["Inventory host name={{ inventory_hostname }}"]},"\n    - name: Update total memory\n      ansible.builtin.lineinfile:\n        path: /root/hwreport.txt\n        regexp: '^Total memory in MB'\n        line: ",{"b":"\"Total memory in MB={{ ansible_memtotal_mb }}\"","l":1,"e":"ansible_memtotal_mb — the host's total RAM as a gathered fact, already in MiB, which is why the label needs no conversion.","h":"Label plus the memtotal fact.","a":["Total memory in MB={{ ansible_memtotal_mb }}"]},"\n    - name: Update BIOS version\n      ansible.builtin.lineinfile:\n        path: /root/hwreport.txt\n        regexp: '^BIOS version'\n        line: ",{"b":"\"BIOS version={{ ansible_bios_version }}\"","l":1,"e":"ansible_bios_version — the firmware version fact, dropped straight into its labelled line.","h":"Label plus the bios version fact.","a":["BIOS version={{ ansible_bios_version }}"]},"\n    ",{"b":"- name: Update vda size\n      ansible.builtin.lineinfile:\n        path: /root/hwreport.txt\n        regexp: '^Size of disk device sda'\n        line: \"Size of disk device sda={{ ansible_devices['sda']['size'] | default('NONE') }}\"","l":3,"m":true,"e":"The disk tasks read the ansible_devices dictionary — and the labels use the lab file's own sda/sdb names, whatever the question's wording calls them. The filter default('NONE') is the safety net: a host without that disk prints NONE instead of crashing the whole run on an undefined value.","h":"lineinfile on sda, with default('NONE') guarding the size."},"\n    ",{"b":"- name: Update vdb size\n      ansible.builtin.lineinfile:\n        path: /root/hwreport.txt\n        regexp: '^Size of disk device sdb'\n        line: \"Size of disk device sdb={{ ansible_devices['sdb']['size'] | default('NONE') }}\"","l":3,"m":true,"e":"The same shape for the second disk: sdb in the file's labels, the same default('NONE') guard. Learn the pattern once, apply it per disk.","h":"Same as sda, for sdb."},"\n"]},{"id":"q14-locker","q":14,"step":"Q14.2","name":"locker.yml","path":"/home/student/ansible/locker.yml","lang":"yaml","spec":"Inside the vault file that ansible-vault create opened, enter the two password variables exactly: the developer password and the manager password. When you save, the file encrypts — this plaintext is the last time it is ever readable.","blueprint":"Two key: value lines — a variables file, not a playbook. It lives inside an Ansible Vault, so on disk this content exists only in encrypted form; playbooks decrypt it in memory at runtime.","summary":"You stored the two account passwords as vault variables. Q15's playbook will read them from here instead of hard-coding secrets into a playbook anyone can read.","modules":["vault"],"bash":{"answer":"ansible-vault view locker.yml --vault-password-file secret.txt","a":["ansible-vault view locker.yml"],"explain":"view decrypts and prints the vault in the terminal (using the password file) without ever writing plaintext to disk."},"top":2,"segs":["pw_developer: ",{"b":"Imadev","l":1,"e":"The developer password, stored as a variable. Q15's users.yml loads this vault file and hashes pw_developer into every developer account it creates.","h":"The developer password from the question."},"\npw_manager: ",{"b":"Imamgr","l":2,"e":"The manager password — a separate variable on purpose, so managers and developers never share one credential that would have to be rotated everywhere at once.","h":"The manager password from the question."},"\n"]},{"id":"q15-user-list","q":15,"step":"Q15","name":"user_list.yml","path":"/home/student/ansible/user_list.yml","lang":"yaml","spec":"Author the user_list.yml data file that the Q15 step downloads: a users list of four people, each entry carrying username, uid, and job — alice (1201, developer), vincent (1202, developer), sandy (2201, manager), patrick (2202, manager).","blueprint":"A pure data file: one list named users, holding one dictionary per person. The three keys in each entry are not your choice — they are dictated by the playbook that consumes them, which reads item.username, item.uid, and item.job.","summary":"You wrote the data half of Q15: the playbook is the machine and this list is its input. People get added or changed here — never inside the playbook.","modules":[],"bash":{"answer":"ansible-playbook users.yml --vault-password-file secret.txt","a":["ansible-navigator run users.yml -m stdout --vault-password-file secret.txt"],"explain":"This is the run that consumes the list — without the vault password file, the locker cannot be decrypted and the run stops before the first task."},"orig":"---\nusers:\n  - username: alice\n    uid: 1201\n    job: developer\n  - username: vincent\n    uid: 1202\n    job: developer\n  - username: sandy\n    uid: 2201\n    job: manager\n  - username: patrick\n    uid: 2202\n    job: manager\n","segs":["---\n",{"b":"users","l":2,"e":"The list's name is a contract: users.yml loops over a variable called exactly users. Rename this key and the playbook finds nothing to loop over.","h":"The variable name the playbook loops over."},":\n  - username: ",{"b":"alice","l":1,"e":"Alice — the first developer.","h":"Developer number one."},"\n    uid: ",{"b":"1201","l":1,"e":"Alice's fixed UID. The playbook applies it verbatim through item.uid — IDs are assigned by this file, never left to chance.","h":"12xx range for developers."},"\n    job: ",{"b":"developer","l":1,"e":"job is the field the when conditions test in users.yml: developer routes her to dev and test hosts, into the devops group, with the developer password.","h":"Her job value."},"\n  - username: vincent\n    uid: ",{"b":"1202","l":1,"e":"Vincent's UID — developers live in the 12xx range, managers in the 22xx range.","h":"One more than Alice's."},"\n    job: developer\n  - username: sandy\n    uid: 2201\n    job: ",{"b":"manager","l":1,"e":"Sandy is a manager — in users.yml that means prod hosts only, the opsmgr group, and the manager password.","h":"Her job value."},"\n  - ",{"b":"username: patrick\n    uid: 2202\n    job: manager","l":3,"m":true,"e":"Patrick completes the set: the second manager, UID 2202. All four entries carry the same three keys — username, uid, job — because users.yml reads exactly those fields off every item it loops over.","h":"username patrick, uid 2202, job manager."},"\n"]},{"id":"q15-users","q":15,"step":"Q15.1","name":"users.yml","path":"/home/student/ansible/users.yml","lang":"yaml","spec":"Create users.yml: one play on all hosts that loads user_list.yml and then locker.yml as vars_files. Task 1 creates the groups devops and opsmgr in a loop. Task 2 loops over every user and creates the developers — devops group, /bin/bash shell, the vault's developer password hashed — only where the person is a developer and the host is in dev or test. Task 3 mirrors it for managers on prod hosts.","blueprint":"A data-driven capstone play: vars_files feed it two inputs, task 1 builds the groups, and tasks 2–3 run the SAME user module in a loop — each person's job plus the host's group decides who lands where, with which group and which password.","summary":"You built the capstone of the whole set: vault secrets plus downloaded data plus one looped module create four different accounts across the fleet — a host in both test and prod ends up with all four users.","modules":["group","user","vault"],"bash":{"answer":"ansible-playbook users.yml --vault-password-file secret.txt","a":["ansible-navigator run users.yml -m stdout --vault-password-file secret.txt"],"explain":"The --vault-password-file flag is not optional decoration: without it the vault cannot be decrypted and the run stops before task 1."},"segs":["---\n- name: Manage Users and Groups\n  hosts: all\n  become: true\n  ",{"b":"vars_files","l":2,"e":"vars_files loads variable files before any task runs. Two files here, and their list order is their load order: the people data first, then the vault.","h":"The play section that loads variable files."},":\n    - ",{"b":"user_list.yml","l":1,"e":"The people data, downloaded from the exam server in the Q15 step — its users list is what both user tasks loop over.","h":"The downloaded data file."},"\n    - ",{"b":"locker.yml","l":1,"e":"Q14's vault file. pw_developer and pw_manager live inside it, encrypted at rest, decrypted in memory for this run.","h":"The vault from Q14."},"\n  tasks:\n    - name: Ensure devops group exist\n      ansible.builtin.group:\n        name: \"{{ item }}\"\n        state: present\n      ",{"b":"loop","l":2,"e":"loop runs this task once per entry in the list below, with the variable item bound to each value in turn — devops first, then opsmgr. One task, two groups.","h":"The keyword that repeats a task over a list."},":\n        - devops\n        - opsmgr\n    - name: create users whose job is a developer on dev and test host group\n      ",{"b":"ansible.builtin.user","l":2,"e":"user creates and manages accounts: name, uid, supplementary groups, shell, and password — a person's whole identity in one task, then looped over the people list.","h":"The account-management module (FQCN of user).","a":["user"]},":\n        name: \"{{ item.username }}\"\n        uid: \"{{ item.uid }}\"\n        groups: ",{"b":"devops","l":1,"e":"The developers' supplementary group — created by task 1 above. Groups must exist before users can join them; that is why the group task leads the play.","h":"The developers' group."},"\n        append: ",{"b":"true","l":1,"e":"append: true ADDS devops to each user's group list. Without it, the user module would REPLACE their entire supplementary group membership with just this one group.","h":"Boolean on — add, do not replace.","a":["yes","True"]},"\n        shell: ",{"b":"/bin/bash","l":1,"e":"The login shell every created account gets.","h":"The standard shell path."},"\n        password: ",{"b":"\"{{ pw_developer | password_hash('sha512') }}\"","l":1,"e":"The vault's developer password, passed through the password_hash filter with SHA-512 at runtime. The user module needs a HASH, never plaintext — and the plaintext itself never exists outside the vault unencrypted.","h":"pw_developer through password_hash with sha512.","a":["{{ pw_developer | password_hash('sha512') }}"]},"\n        state: present\n      loop: \"{{ users }}\"\n      ",{"b":"when: (item.job == 'developer' and inventory_hostname in groups['dev']) or (item.job == 'developer' and inventory_hostname in groups['test'])","l":3,"e":"The routing rule: (developer AND dev host) OR (developer AND test host). The parentheses matter — each and-pair is one complete case, and or joins the two cases. This single line is what keeps developers off the prod hosts while the play targets all.","h":"Two and-cases joined by or, each wrapped in parentheses: developer+dev, developer+test."},"\n    ",{"b":"- name: create users whose job is manager on database host group\n      ansible.builtin.user:\n        name: \"{{ item.username }}\"\n        uid: \"{{ item.uid }}\"\n        groups: opsmgr\n        append: true\n        shell: /bin/bash\n        password: \"{{ pw_manager | password_hash('sha512') }}\"\n        state: present\n      loop: \"{{ users }}\"\n      when: item.job == 'manager' and inventory_hostname in groups['prod']","l":3,"m":true,"e":"The manager task mirrors the developer task with exactly three swaps: the opsmgr group, the pw_manager password, and a single and-condition — managers land on prod hosts only. Same module, same loop, different routing.","h":"Mirror task: opsmgr group, pw_manager, and a manager+prod when."},"\n"]},{"id":"q16-vault-rekey","q":16,"step":"Q16","name":"sal.yml — vault rekey (commands)","path":"/home/student/ansible/sal.yml","lang":"bash","kind":"cmd","spec":"Download the vault-encrypted sal.yml from the exam server into ~/ansible, then change its vault password from insecure4sure to secure1234 with a single rekey operation — and verify you can view it with the new password.","blueprint":"No playbook in this question — three terminal moves: get into the project directory, fetch the vault file, rekey it in place. The skill being tested is choosing the ONE correct vault operation.","summary":"You rotated a vault password the one correct way: rekey, in place, in a single step — never decrypt-to-plaintext and re-encrypt.","modules":["vault"],"bash":{"answer":"ansible-vault view sal.yml","a":["ansible-vault view sal.yml --ask-vault-pass"],"explain":"view with the new password (secure1234) proves the rekey worked — if it opens, the rotation is complete."},"orig":"cd ~/ansible\ncurl -o sal.yml http://10.1.10.121/sal.yml\nansible-vault rekey sal.yml\n","segs":[{"b":"cd ~/ansible","l":1,"e":"Work inside the project directory: the vault file belongs beside the playbooks, and the following commands address it by its bare filename.","h":"Change directory into the ansible project."},"\n",{"b":"curl -o sal.yml","l":2,"e":"curl with -o downloads and names the file in one step. The name matters — the next command addresses the file as sal.yml.","h":"curl plus the -o output flag."}," ",{"b":"http://10.1.10.121/sal.yml","l":1,"e":"The encrypted salaries file, served by the exam server.","h":"The exam server plus sal.yml."},"\n",{"b":"ansible-vault rekey sal.yml","l":3,"e":"rekey swaps the vault's password in ONE operation — you enter the old password (insecure4sure), then the new one (secure1234) twice. The trap in this question: decrypting to plaintext and re-encrypting also \"works\" mechanically, but it FAILS the requirement — rekey is the graded, single-step operation.","h":"ansible-vault plus the subcommand that changes a vault's password.","w":"Decrypt-then-encrypt is the graded trap here — the question demands the single rekey operation."},"\n"]}];
const MODULES = {"dnf":{"name":"ansible.builtin.dnf","what":"The RPM package manager module — installs, removes, and updates packages and package groups on RHEL-family hosts.","params":"name (a package, a list, '@Group' for a package group, '*' for all), state: present / latest / absent","breaks":"Nothing gets installed; every later task that assumes a package or daemon exists fails downstream.","links":"Feeds service (daemons must be installed before they can start) and firewalld (the daemon itself is a package first)."},"service":{"name":"ansible.builtin.service","what":"Manages daemons: whether they are running right now and whether they start at boot.","params":"name (ONE service per task — loop for several), state: started / stopped / restarted, enabled: true/false","breaks":"Installed software that never runs: httpd installed but not started serves nothing, and without enabled it dies at the first reboot.","links":"Depends on dnf having installed the daemon; the firewalld module depends on this task having started firewalld."},"firewalld":{"name":"ansible.posix.firewalld","what":"Manages firewalld rules by service or port. Talks to the running firewalld daemon over D-Bus. From the ansible.posix collection.","params":"service (http, https — port bundles), state: enabled, immediate: true (runtime now), permanent: true (survives reboot)","breaks":"The web server runs but nobody can reach it — ports stay closed. With only one of immediate/permanent, the rule vanishes at reboot or never applies until one.","links":"Depends on the firewalld package (dnf) and the running daemon (service). Used in the apache role and in roles.yml's post_tasks."},"template":{"name":"ansible.builtin.template","what":"Renders a Jinja2 (.j2) file on the controller using the target host's facts and variables, then delivers the rendered file.","params":"src (the .j2 file), dest (where it lands), setype and other file attributes","breaks":"Without it there is no per-host content: copy would
