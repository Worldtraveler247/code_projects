<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galactic Guardian - Space Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
  .back-to-hub{position:fixed;top:12px;left:12px;z-index:9999;background:rgba(7,1,15,0.82);border:1px solid rgba(74,247,255,0.25);color:#4af7ff;font-family:system-ui,sans-serif;font-size:0.78rem;font-weight:600;letter-spacing:0.06em;padding:6px 12px;border-radius:6px;text-decoration:none;backdrop-filter:blur(8px);transition:background 0.15s,border-color 0.15s;}
  .back-to-hub:hover{background:rgba(74,247,255,0.12);border-color:rgba(74,247,255,0.55);}
</style>
<body>
<a href="../index.html" class="back-to-hub">&#8592; Back to Hub</a>
    <div id="game-container">
        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="ui-overlay">
                <div id="hud">
                    <div id="score">Score: 0</div>
                    <div id="health-bar-container">
                        <div id="health-bar"></div>
                    </div>
                    <div id="level">Level: 1</div>
                </div>
                <div id="game-over" class="hidden">
                    <h1>GAME OVER</h1>
                    <p>Final Score: <span id="final-score">0</span></p>
                    <button id="restart-btn">Restart Mission</button>
                </div>
                <div id="start-screen">
                    <h1>GALACTIC GUARDIAN</h1>
                    <div id="desktop-instr">
                        <p>Use Arrow Keys or WASD to Move<br>Spacebar to Shoot</p>
                    </div>
                    <div id="mobile-instr" class="hidden">
                        <p>Use the Virtual Joystick to Move<br>Tap the FIRE button to Shoot</p>
                    </div>
                    <button id="start-btn">Launch Ship</button>
                </div>
            </div>
        </div>
        <div id="mobile-controls" class="hidden">
            <div id="joystick-container">
                <div id="joystick-base"></div>
                <div id="joystick-knob"></div>
            </div>
            <div id="fire-button">FIRE</div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
