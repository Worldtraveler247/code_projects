<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galactic Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
  .back-to-hub{position:fixed;top:12px;left:12px;z-index:9999;background:rgba(7,1,15,0.82);border:1px solid rgba(74,247,255,0.25);color:#4af7ff;font-family:system-ui,sans-serif;font-size:0.78rem;font-weight:600;letter-spacing:0.06em;padding:6px 12px;border-radius:6px;text-decoration:none;backdrop-filter:blur(8px);transition:background 0.15s,border-color 0.15s;}
  .back-to-hub:hover{background:rgba(74,247,255,0.12);border-color:rgba(74,247,255,0.55);}
</style>
<body>
<a href="../index.html" class="back-to-hub">&#8592; Back to Hub</a>
    <div id="game-container">
        <div id="ui">
            <span id="lives-display">♥♥♥</span>
            <span id="stage-label" class="hud-title">TWILIGHT VALLEY</span>
            <span id="score"><span class="gem">✦</span> 0</span>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <div id="joystick-zone" class="joystick-zone">
                <div class="joystick-base">
                    <div id="joystick-knob" class="joystick-knob"></div>
                </div>
            </div>
            <div class="action-pad">
                <button id="jump-btn" class="control-btn jump-btn">JUMP</button>
            </div>
        </div>
        <footer class="credit">Created by Eddie Camacho</footer>
    </div>
    <script src="game.js"></script>
</body>
</html>
