<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chess — Eddie Camacho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
<a href="../index.html" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(10,10,20,0.85);backdrop-filter:blur(6px);color:#4af7ff;border:1px solid #4af7ff;border-radius:20px;padding:6px 14px;font-family:sans-serif;font-size:13px;text-decoration:none;font-weight:600;">← App Hub</a>

    <div id="ui-container">
        <button id="panel-toggle" onclick="togglePanel()" title="Hide controls">✕</button>
        <div id="panel-content">
            <h1>3D Chess</h1>
            <div class="player-names">
                <div class="player-row">
                    <span class="piece-dot white-dot"></span>
                    <input id="name-white" type="text" placeholder="White player" maxlength="24">
                </div>
                <div class="player-comment-wrap">
                    <label class="comment-label">White's note to opponent:</label>
                    <div
                        id="comment-white"
                        class="player-comment"
                        contenteditable="true"
                        data-player="white"
                        data-placeholder="Leave a message…"
                    ></div>
                    <span class="comment-saved" id="saved-white">saved</span>
                </div>
                <div class="player-row">
                    <span class="piece-dot black-dot"></span>
                    <input id="name-black" type="text" placeholder="Black player" maxlength="24">
                </div>
                <div class="player-comment-wrap">
                    <label class="comment-label">Black's note to opponent:</label>
                    <div
                        id="comment-black"
                        class="player-comment"
                        contenteditable="true"
                        data-player="black"
                        data-placeholder="Leave a message…"
                    ></div>
                    <span class="comment-saved" id="saved-black">saved</span>
                </div>
            </div>
            <p id="status">White's Turn</p>
            <div class="divider"></div>
            <div class="game-controls">
                <button onclick="resetGame()">↺ &nbsp;New Game</button>
                <button onclick="flipCamera()">⟳ &nbsp;Flip Board</button>
            </div>
            <div id="move-log"></div>
            <div class="controls-hint">Drag to rotate · Scroll to zoom</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const firebaseConfig = {
            apiKey:            "AIzaSyB32tq3zgAGSmaBWk-7U6MELbuY6CHgRZg",
            authDomain:        "d-chess-2144c.firebaseapp.com",
            databaseURL:       "https://d-chess-2144c-default-rtdb.firebaseio.com",
            projectId:         "d-chess-2144c",
            storageBucket:     "d-chess-2144c.firebasestorage.app",
            messagingSenderId: "1072084230845",
            appId:             "1:1072084230845:web:25980b63f706f2fc9d4dd4"
        };
        firebase.initializeApp(firebaseConfig);
    </script>
    <script src="app.js"></script>
</body>
</html>
